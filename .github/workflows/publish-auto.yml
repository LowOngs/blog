name: Publish Blog (Auto)

on:
  schedule:
    - cron: "20 3 * * *"   # UTC 03:20
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: npm ci

      # 1) 스케줄일 때만 통제: (A) SCHEDULE_MODE=live (B) auto-enable.json=true
      - name: Guard — allow schedule only when live + switch enabled
        id: guard
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_MODE: ${{ secrets.SCHEDULE_MODE }}
        run: |
          set -euo pipefail
          echo "event_name=$EVENT_NAME"
          echo "SCHEDULE_MODE=$SCHEDULE_MODE"

          # 기본: 허용
          allow="true"
          reason="ok"

          if [ "$EVENT_NAME" = "schedule" ]; then
            # 1) secrets gate
            if [ "${SCHEDULE_MODE}" != "live" ]; then
              allow="false"
              reason="blocked: SCHEDULE_MODE != live"
            fi

            # 2) file switch gate (auto-enable.json)
            if [ "$allow" = "true" ]; then
              if [ ! -f "System_files/manifests/auto-enable.json" ]; then
                allow="false"
                reason="blocked: missing auto-enable.json"
              else
                # node로 안전 파싱(없으면 false)
                sw=$(node -e "try{const j=require('./System_files/manifests/auto-enable.json');process.stdout.write(String(!!j.autoEnable));}catch(e){process.stdout.write('false');}")
                if [ "$sw" != "true" ]; then
                  allow="false"
                  reason="blocked: autoEnable != true"
                fi
              fi
            fi
          fi

          echo "allow=$allow"   >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "[GUARD] allow=$allow / $reason"

      # 2) 아래부터는 guard 통과한 경우에만 실행 (스케줄 폭주 방지 핵심)
      - name: Build & Publish (auto)
        if: steps.guard.outputs.allow == 'true'
        shell: bash
        env:
          RUN_MODE: auto
          DRY_RUN: "false"
          SCHEDULE_MODE: ${{ secrets.SCHEDULE_MODE }}
        run: |
          set -euo pipefail

          node System_files/scripts/build/seed-scheduler.cjs
          node System_files/scripts/build/queue-to-posts.cjs
          node System_files/scripts/build/generate-body.cjs

          npm run posts:render
          node System_files/scripts/build/normalize-body.cjs

          npm run images:renew
          npm run images:build:og
          node System_files/scripts/build/r2-upload.js
          node System_files/scripts/build/rewrite-images.js

          npm run posts:validate
          npm run publish:blogger

      - name: Skipped note
        if: steps.guard.outputs.allow != 'true'
        run: |
          echo "[SKIP] Auto publish blocked."
          echo "reason=${{ steps.guard.outputs.reason }}"
