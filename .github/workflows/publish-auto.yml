name: Publish Blog (Auto)

on:
  schedule:
    # 매일 11:20 KST 기준이면 UTC로 02:20 입니다.
    # 필요 시 옹스님 실제 운영 타임존에 맞게 조정하세요.
    - cron: "20 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          npm ci

      # ✅ 오토(스케줄)일 때만 강하게 차단/허용
      - name: Guard — scheduled run allowed only when SCHEDULE_MODE=live
        env:
          SCHEDULE_MODE: ${{ secrets.SCHEDULE_MODE }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "event_name=$EVENT_NAME"
          echo "SCHEDULE_MODE=$SCHEDULE_MODE"

          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$SCHEDULE_MODE" != "live" ]; then
              echo "[GUARD] schedule trigger blocked: SCHEDULE_MODE != live"
              exit 0
            fi
          fi

      - name: Build & Publish (auto)
        env:
          RUN_MODE: auto
          DRY_RUN: "false"
          # 아래 SCHEDULE_MODE=live는 '내부 파이프라인 흐름'용이고,
          # 실제 자동발행 차단/허용은 위 GUARD가 secrets.SCHEDULE_MODE로 결정합니다.
          SCHEDULE_MODE: live
        run: |
          set -euo pipefail

          node System_files/scripts/build/seed-scheduler.cjs
          node System_files/scripts/build/queue-to-posts.cjs
          node System_files/scripts/build/generate-body.cjs

          npm run posts:render
          node System_files/scripts/build/normalize-body.cjs

          npm run images:renew
          npm run images:build:og
          node System_files/scripts/build/r2-upload.js
          node System_files/scripts/build/rewrite-images.js

          npm run posts:validate
          npm run publish:blogger
