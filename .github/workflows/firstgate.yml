name: firstgate-daily

on:
  schedule:
    - cron: '40 23 * * *'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
  CANONICAL_BASE: ${{ secrets.CANONICAL_BASE }}
  CDN_BASE: ${{ secrets.CDN_BASE }}
  PAGE_ID_MODE: ${{ secrets.PAGE_ID_MODE }}
  SCHEDULE_MODE: ${{ secrets.SCHEDULE_MODE }}

jobs:
  build-queue:
    runs-on: ubuntu-latest

    steps:
      - name: Gate
        id: gate
        shell: bash
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "schedule_mode=${SCHEDULE_MODE}"

          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "${SCHEDULE_MODE}" != "live" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping by SCHEDULE_MODE"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Proceeding"
          fi

      - name: Checkout
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        if: ${{ steps.gate.outputs.run == 'true' }}
        working-directory: google-blog/System_files
        run: npm ci

      - name: Build queue and artifacts
        if: ${{ steps.gate.outputs.run == 'true' }}
        working-directory: google-blog/System_files
        run: |
          node scripts/build/firstgate-pick.cjs
          node scripts/build/firstgate-queue-to-post.cjs
          node scripts/build/generate-body.cjs
          node scripts/build/render-posts.cjs
          node scripts/build/images-renew.cjs
          node scripts/build/images-build-og.cjs
          node scripts/build/rewrite-images.js
          node scripts/build/validate-repair.cjs
