name: firstgate-daily

on:
  schedule:
    - cron: '40 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ongsblog-publish
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
  CANONICAL_BASE: ${{ secrets.CANONICAL_BASE }}
  CDN_BASE: ${{ secrets.CDN_BASE }}

  # ✅ 새 안전장치(스케줄 실동작 통제)
  PUBLISH_MODE: ${{ secrets.PUBLISH_MODE }}

jobs:
  build-queue:
    runs-on: ubuntu-latest

    steps:
      - name: Guard (schedule requires PUBLISH_MODE=enable + auto switch=true)
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "event_name=$EVENT_NAME"
          echo "PUBLISH_MODE=${PUBLISH_MODE}"

          # workflow_dispatch는 항상 허용(빌드/검증 목적)
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "[GUARD] workflow_dispatch -> allowed"
            exit 0
          fi

          # schedule일 때만 강제 통제
          if [ "${PUBLISH_MODE}" != "enable" ]; then
            echo "[GUARD] blocked: PUBLISH_MODE != enable"
            exit 0
          fi

          if [ ! -f "System_files/manifests/auto-enable.json" ]; then
            echo "[GUARD] blocked: missing auto-enable.json"
            exit 0
          fi

          sw=$(node -e "try{const j=require('./System_files/manifests/auto-enable.json');process.stdout.write(String(!!j.autoEnable));}catch(e){process.stdout.write('false');}")
          if [ "$sw" != "true" ]; then
            echo "[GUARD] blocked: autoEnable != true"
            exit 0
          fi

          echo "[GUARD] schedule allowed"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build firstgate artifacts (no publish)
        run: |
          set -euo pipefail

          node System_files/scripts/build/firstgate-pick.cjs
          node System_files/scripts/build/firstgate-queue-to-post.cjs
          node System_files/scripts/build/generate-body.cjs

          node System_files/scripts/build/render-posts.cjs
          node System_files/scripts/build/images-renew.cjs
          node System_files/scripts/build/images-build-og.cjs

          node System_files/scripts/build/validate-repair.cjs
