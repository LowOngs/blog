name: freshness-90days

on:
  workflow_dispatch:
    inputs:
      DRY_RUN:
        description: "true/false (true면 커밋만, 발행은 안 함)"
        required: false
        default: "true"
  schedule:
    - cron: "35 2 * * 1" # UTC 02:35 (매주 월요일)

permissions:
  contents: write

concurrency:
  group: freshness-90days-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      CANONICAL_BASE: ${{ secrets.CANONICAL_BASE }}
      CDN_BASE: ${{ secrets.CDN_BASE }}

      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

      PUBLISH_MODE: ${{ secrets.PUBLISH_MODE }}

      DRY_RUN_INPUT: ${{ github.event.inputs.DRY_RUN || 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install (repo root)
        run: npm ci

      - name: Export runtime env
        run: |
          echo "DRY_RUN=${DRY_RUN_INPUT}" >> $GITHUB_ENV
          echo "BODY_WRITE_MODE=local" >> $GITHUB_ENV

      - name: Preflight checks (fail fast)
        run: |
          echo "──────── Preflight START ────────"
          node -v
          npm -v
          node -e "require('sharp')" || { echo '❌ sharp missing'; exit 1; }
          test -d System_files/content/reviews || { echo "❌ content/reviews missing"; exit 1; }
          echo "──────── Preflight PASS ────────"

      - name: Build due list (90days)
        run: |
          npm run reviews:due

      - name: Run freshness updater (your 90days step)
        run: |
          # 옹스님이 만든 갱신 스크립트가 여기서 돌아가면 됩니다.
          # (예: rating/insight/lastChecked/nextCheck 갱신)
          # 지금은 “이 라인만 유지”하고, 실제 명령은 옹스님 프로젝트에 맞춰 연결합니다.
          # 만약 이미 스크립트 이름이 확정돼 있으면 여기만 교체하면 됩니다.
          echo "TODO: connect your ratings/insights refresh command here"
          exit 0

      - name: Inject reviewData to posts (resolver)
        run: |
          npm run posts:review:resolve

      - name: Render posts
        run: |
          npm run posts:render

      - name: Normalize body
        run: |
          npm run posts:normalize

      - name: Inject review meta blocks (HTML)
        run: |
          npm run posts:review:meta

      - name: Validate & repair
        run: |
          npm run posts:validate

      - name: Preflight QA
        run: |
          npm run posts:qa

      - name: Publish to Blogger (skip when DRY_RUN=true)
        if: env.DRY_RUN != 'true'
        run: |
          npm run publish:blogger

      - name: Commit freshness updates
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: 90days freshness refresh"
          git push
