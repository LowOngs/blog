name: freshness-90days

on:
  workflow_dispatch:
    inputs:
      DRY_RUN:
        description: "true/false (true면 커밋만, 발행은 안 함)"
        required: false
        default: "true"
  schedule:
    - cron: "35 2 * * 1" # KST 11:35, 매주 월요일(UTC 02:35)

permissions:
  contents: write

concurrency:
  group: freshness-90days-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      CANONICAL_BASE: ${{ secrets.CANONICAL_BASE }}
      CDN_BASE: ${{ secrets.CDN_BASE }}

      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

      PUBLISH_MODE: ${{ secrets.PUBLISH_MODE }}
      DRY_RUN_INPUT: ${{ github.event.inputs.DRY_RUN || 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install (repo root)
        run: npm ci

      - name: Export runtime env
        run: |
          echo "DRY_RUN=${DRY_RUN_INPUT}" >> $GITHUB_ENV
          echo "BODY_WRITE_MODE=local" >> $GITHUB_ENV

      - name: Sanity check (required scripts exist)
        run: |
          test -f System_files/scripts/build/review-due-90days.cjs
          test -f System_files/scripts/build/review-next-from-due.cjs
          test -f System_files/scripts/build/review-diff-update.cjs
          test -f System_files/scripts/build/review-resolver.cjs

          test -f System_files/scripts/build/validate-body-images.cjs

          test -f System_files/scripts/build/render-posts.cjs
          test -f System_files/scripts/build/normalize-body.cjs
          test -f System_files/scripts/build/review-meta-block.cjs

          test -f System_files/scripts/build/validate-repair.cjs
          test -f System_files/scripts/build/qa-check.cjs
          test -f System_files/scripts/publish/blogger.cjs

          # ✅ OG 재생성/업로드 포함
          test -f System_files/scripts/build/images-renew.cjs
          test -f System_files/scripts/build/images-build-og.cjs

          # ✅ AOIA meta/feed/tools
          test -f System_files/scripts/build/ai-meta.js
          test -f System_files/scripts/build/build-feed.cjs
          test -f System_files/scripts/build/validate-feed.cjs
          test -f System_files/scripts/build/copy-tools.cjs
          test -f System_files/scripts/build/build-trust-page.cjs

      - name: Run 90days chain (due -> next -> diff -> inject)
        run: |
          npm run reviews:freshness

      - name: Validate body images manifest
        working-directory: System_files
        run: |
          node scripts/build/validate-body-images.cjs

      - name: Render posts
        working-directory: System_files
        run: |
          node scripts/build/render-posts.cjs
          node scripts/build/normalize-body.cjs
          node scripts/build/review-meta-block.cjs

      - name: Build OG images (after render)
        working-directory: System_files
        run: |
          node scripts/build/images-renew.cjs
          node scripts/build/images-build-og.cjs

      - name: Upload images to R2
        working-directory: System_files
        run: |
          npm run images:upload

      - name: Validate & repair
        working-directory: System_files
        run: |
          node scripts/build/validate-repair.cjs

      - name: Preflight QA
        working-directory: System_files
        run: |
          npm run posts:qa

      # ✅ AOIA: authority/feed/tools 갱신
      - name: Build AI meta (authority, etc.)
        working-directory: System_files
        run: |
          node scripts/build/ai-meta.js

      - name: Build AI feed
        working-directory: System_files
        run: |
          node scripts/build/build-feed.cjs

      - name: Validate AI feed
        working-directory: System_files
        run: |
          node scripts/build/validate-feed.cjs

      - name: Build tools (edit-request)
        working-directory: System_files
        run: |
          node scripts/build/copy-tools.cjs

      - name: Build Trust page
        working-directory: System_files
        run: |
          node scripts/build/build-trust-page.cjs

      - name: Publish to Blogger (skip when DRY_RUN=true)
        if: env.DRY_RUN != 'true'
        working-directory: System_files
        run: |
          node scripts/publish/blogger.cjs

      - name: Commit freshness updates
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: 90days freshness refresh"
          git push
