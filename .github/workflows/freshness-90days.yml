name: freshness-90days

on:
  workflow_dispatch:
    inputs:
      DRY_RUN:
        description: "true/false (true면 커밋만, 발행은 안 함)"
        required: false
        default: "true"
  schedule:
    - cron: "35 2 * * 1" # KST 11:35, 매주 월요일(UTC 기준)

permissions:
  contents: write

concurrency:
  group: freshness-90days-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      CANONICAL_BASE: ${{ secrets.CANONICAL_BASE }}
      CDN_BASE: ${{ secrets.CDN_BASE }}

      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

      PUBLISH_MODE: ${{ secrets.PUBLISH_MODE }}
      DRY_RUN_INPUT: ${{ github.event.inputs.DRY_RUN || 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ✅ 의존성은 루트에서 설치
      - name: Install (root)
        run: npm ci

      - name: Export runtime env
        run: |
          echo "DRY_RUN=${DRY_RUN_INPUT}" >> $GITHUB_ENV
          echo "BODY_WRITE_MODE=local" >> $GITHUB_ENV

      - name: Run 90days freshness (ratings/insights)
        run: |
          # package.json에 옹스님이 추가한 라인 이름 그대로 사용
          npm run reviews:90days

      - name: Inject reviewData to posts (resolver)
        run: node ./System_files/scripts/build/review-resolver.cjs

      - name: Render posts
        run: node ./System_files/scripts/build/render-posts.cjs

      - name: Validate & repair
        run: node ./System_files/scripts/build/validate-repair.cjs

      - name: Preflight QA
        run: node ./System_files/scripts/build/qa-check.cjs

      - name: Publish to Blogger (skip when DRY_RUN=true)
        if: env.DRY_RUN != 'true'
        run: node ./System_files/scripts/publish/blogger.cjs

      - name: Commit freshness updates
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: 90days freshness refresh"
          git push
