name: freshness-90days

on:
  workflow_dispatch:
    inputs:
      DRY_RUN:
        description: "true/false (true면 커밋만, 발행은 안 함)"
        required: false
        default: "true"
  schedule:
    - cron: "35 2 * * 1" # KST 11:35, 매주 월요일(UTC 02:35)

permissions:
  contents: write

concurrency:
  group: freshness-90days-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # ✅ Node24 액션 런타임 강제 시험
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

      CANONICAL_BASE: ${{ secrets.CANONICAL_BASE }}
      CDN_BASE: ${{ secrets.CDN_BASE }}

      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

      PUBLISH_MODE: ${{ secrets.PUBLISH_MODE }}
      DRY_RUN_INPUT: ${{ github.event.inputs.DRY_RUN || 'true' }}

    steps:
      - name: Guard (schedule requires PUBLISH_MODE=enable + auto-enable.json)
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "event_name=$EVENT_NAME"
          echo "PUBLISH_MODE=${PUBLISH_MODE}"

          # 기본값: 파이프라인 실행
          echo "SKIP_PIPELINE=false" >> $GITHUB_ENV

          # workflow_dispatch는 항상 허용(점검/커밋 목적)
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "[GUARD] workflow_dispatch -> allowed"
            exit 0
          fi

          # schedule일 때만 강제 통제
          if [ "${PUBLISH_MODE}" != "enable" ]; then
            echo "[GUARD] blocked: PUBLISH_MODE != enable"
            echo "SKIP_PIPELINE=true" >> $GITHUB_ENV
            exit 0
          fi

          if [ ! -f "System_files/manifests/auto-enable.json" ]; then
            echo "[GUARD] blocked: missing System_files/manifests/auto-enable.json"
            echo "SKIP_PIPELINE=true" >> $GITHUB_ENV
            exit 0
          fi

          sw=$(node -e "try{const j=require('./System_files/manifests/auto-enable.json');process.stdout.write(String(!!j.autoEnable));}catch(e){process.stdout.write('false');}")
          if [ "$sw" != "true" ]; then
            echo "[GUARD] blocked: autoEnable != true"
            echo "SKIP_PIPELINE=true" >> $GITHUB_ENV
            exit 0
          fi

          echo "[GUARD] schedule allowed"
          echo "SKIP_PIPELINE=false" >> $GITHUB_ENV

      - name: Checkout
        if: env.SKIP_PIPELINE != 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        if: env.SKIP_PIPELINE != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install (repo root)
        if: env.SKIP_PIPELINE != 'true'
        run: npm ci

      - name: Export runtime env (DRY_RUN + BODY_WRITE_MODE)
        if: env.SKIP_PIPELINE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"

          # BODY_WRITE_MODE: freshness는 운영상 local 고정(대량 처리 가능)
          echo "BODY_WRITE_MODE=local" >> $GITHUB_ENV

          # DRY_RUN:
          # - schedule + PUBLISH_MODE=enable일 때만 false (실제 업로드/발행)
          # - 그 외는 입력값(기본 true) 유지
          DR="${DRY_RUN_INPUT}"
          if [ "$EVENT" = "schedule" ] && [ "${PUBLISH_MODE}" = "enable" ]; then
            DR="false"
          fi

          echo "DRY_RUN=$DR" >> $GITHUB_ENV

          echo "Resolved:"
          echo "  EVENT=$EVENT"
          echo "  PUBLISH_MODE=${PUBLISH_MODE}"
          echo "  DRY_RUN_INPUT=${DRY_RUN_INPUT}"
          echo "  DRY_RUN=$DR"
          echo "  BODY_WRITE_MODE=local"

      - name: Sanity check (required scripts exist)
        if: env.SKIP_PIPELINE != 'true'
        run: |
          set -euo pipefail

          test -f System_files/scripts/build/review-due-90days.cjs
          test -f System_files/scripts/build/review-next-from-due.cjs
          test -f System_files/scripts/build/review-diff-update.cjs
          test -f System_files/scripts/build/review-resolver.cjs
          test -f System_files/scripts/build/review-trend-commentary.cjs

          test -f System_files/scripts/build/validate-body-images.cjs

          test -f System_files/scripts/build/render-posts.cjs
          test -f System_files/scripts/build/normalize-body.cjs
          test -f System_files/scripts/build/review-meta-block.cjs

          test -f System_files/scripts/build/validate-repair.cjs
          test -f System_files/scripts/build/validate-review-ssot.cjs
          test -f System_files/scripts/build/qa-check.cjs
          test -f System_files/scripts/publish/blogger.cjs

          # ✅ OG 재생성/업로드 포함
          test -f System_files/scripts/build/images-renew.cjs
          test -f System_files/scripts/build/images-build-og.cjs

          # ✅ 최신 구조 기준
          test -f System_files/scripts/build/build-feed.cjs
          test -f System_files/scripts/build/validate-feed.cjs
          test -f System_files/scripts/build/copy-tools.cjs
          test -f System_files/scripts/build/build-trust-page.cjs

      - name: Run 90days chain (due -> next -> diff -> inject)
        if: env.SKIP_PIPELINE != 'true'
        run: |
          set -euo pipefail
          npm run reviews:freshness

      - name: Build review trend commentary (90/180/270/360)
        if: env.SKIP_PIPELINE != 'true'
        working-directory: System_files
        env:
          REVIEW_TREND_MODE: both
        run: |
          set -euo pipefail
          node scripts/build/review-trend-commentary.cjs

      - name: Validate body images manifest
        if: env.SKIP_PIPELINE != 'true'
        working-directory: System_files
        run: |
          set -euo pipefail
          node scripts/build/validate-body-images.cjs

      - name: Render posts
        if: env.SKIP_PIPELINE != 'true'
        working-directory: System_files
        run: |
          set -euo pipefail
          node scripts/build/render-posts.cjs
          node scripts/build/normalize-body.cjs
          node scripts/build/review-meta-block.cjs

      - name: Build OG images (after render)
        if: env.SKIP_PIPELINE != 'true'
        working-directory: System_files
        run: |
          set -euo pipefail
          node scripts/build/images-renew.cjs
          node scripts/build/images-build-og.cjs

      - name: Upload images to R2 (DRY_RUN safe)
        if: env.SKIP_PIPELINE != 'true'
        working-directory: System_files
        run: |
          set -euo pipefail
          npm run images:upload

      - name: Validate & repair
        if: env.SKIP_PIPELINE != 'true'
        working-directory: System_files
        run: |
          set -euo pipefail
          node scripts/build/validate-repair.cjs


      - name: Validate review SSOT
        if: env.SKIP_PIPELINE != 'true'
        working-directory: System_files
        run: |
          set -euo pipefail
          node scripts/build/validate-review-ssot.cjs

      - name: Preflight QA
        if: env.SKIP_PIPELINE != 'true'
        working-directory: System_files
        run: |
          set -euo pipefail
          npm run posts:qa

      - name: Build AI feed
        if: env.SKIP_PIPELINE != 'true'
        working-directory: System_files
        run: |
          set -euo pipefail
          node scripts/build/build-feed.cjs

      - name: Validate AI feed
        if: env.SKIP_PIPELINE != 'true'
        working-directory: System_files
        run: |
          set -euo pipefail
          node scripts/build/validate-feed.cjs

      - name: Build tools (edit-request)
        if: env.SKIP_PIPELINE != 'true'
        working-directory: System_files
        run: |
          set -euo pipefail
          node scripts/build/copy-tools.cjs

      - name: Build Trust page
        if: env.SKIP_PIPELINE != 'true'
        working-directory: System_files
        run: |
          set -euo pipefail
          node scripts/build/build-trust-page.cjs

      - name: Publish to Blogger (skip when DRY_RUN=true)
        if: env.SKIP_PIPELINE != 'true' && env.DRY_RUN != 'true'
        working-directory: System_files
        run: |
          set -euo pipefail
          node scripts/publish/blogger.cjs

      - name: Commit freshness updates
        if: env.SKIP_PIPELINE != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: 90days freshness refresh"
          git push
