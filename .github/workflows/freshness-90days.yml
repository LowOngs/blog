name: freshness-90days

on:
  workflow_dispatch:
    inputs:
      DRY_RUN:
        description: "true/false (true면 커밋만, 발행은 안 함)"
        required: false
        default: "true"
  schedule:
    - cron: "35 2 * * 1" # KST 11:35, 매주 월요일(UTC 02:35)

permissions:
  contents: write

concurrency:
  group: freshness-90days-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      CANONICAL_BASE: ${{ secrets.CANONICAL_BASE }}
      CDN_BASE: ${{ secrets.CDN_BASE }}

      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

      PUBLISH_MODE: ${{ secrets.PUBLISH_MODE }}

      DRY_RUN_INPUT: ${{ github.event.inputs.DRY_RUN || 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        run: npm ci

      - name: Export runtime env
        run: |
          echo "DRY_RUN=${DRY_RUN_INPUT}" >> $GITHUB_ENV
          # 90일 갱신은 “기존 글 수정” 성격 → 안전하게 local 고정
          echo "BODY_WRITE_MODE=local" >> $GITHUB_ENV

      # (A) 90일 due 리스트 산출(대상 식별/리포트)
      - name: Build due list (dist/reviews)
        run: npm run reviews:due

      # (B) (선택이지만 권장) next → baseline 병합
      # - 실제 운영에서는 ratings-next.json이 갱신되어 들어온 뒤 병합해야 함
      - name: Merge ratings-next into ratings (3 buckets)
        run: npm run posts:review:update

      # (C) ratings/insights → posts reviewData 주입
      - name: Inject reviewData to posts (resolver)
        run: npm run posts:review:resolve

      # (D) Render / Normalize / Review meta / Validate / QA
      - name: Render posts
        run: npm run posts:render

      - name: Normalize body
        run: npm run posts:normalize

      - name: Review meta blocks build
        run: npm run posts:review:meta

      - name: Validate & repair
        run: npm run posts:validate

      - name: Preflight QA
        run: npm run posts:qa

      - name: Publish to Blogger (skip when DRY_RUN=true or PUBLISH_MODE!=enable)
        if: env.DRY_RUN != 'true' && env.PUBLISH_MODE == 'enable'
        run: npm run publish:blogger

      - name: Commit freshness updates
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: 90days freshness refresh"
          git push
