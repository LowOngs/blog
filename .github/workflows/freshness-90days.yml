name: freshness-90days

on:
  workflow_dispatch:
    inputs:
      DRY_RUN:
        description: "true/false (true면 커밋만, 발행은 안 함)"
        required: false
        default: "true"
  schedule:
    - cron: "35 2 * * 1" # UTC 02:35 (KST 11:35) 월요일

permissions:
  contents: write

concurrency:
  group: freshness-90days-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      CANONICAL_BASE: ${{ secrets.CANONICAL_BASE }}
      CDN_BASE: ${{ secrets.CDN_BASE }}

      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

      PUBLISH_MODE: ${{ secrets.PUBLISH_MODE }}

      DRY_RUN_INPUT: ${{ github.event.inputs.DRY_RUN || 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Print runner time
        run: |
          echo "Local time:"
          date
          echo "UTC time:"
          date -u

      - name: Install
        working-directory: System_files
        run: npm ci

      - name: Verify native dependencies
        working-directory: System_files
        run: |
          node -e "require('sharp'); console.log('sharp OK')"

      - name: Export runtime env
        run: |
          echo "DRY_RUN=${DRY_RUN_INPUT}" >> $GITHUB_ENV
          # 90일 갱신은 “기존 글 수정”이므로 신규 pageId 발급이 필요 없음
          echo "BODY_WRITE_MODE=local" >> $GITHUB_ENV

      # 1) 90일 due 리스트 생성(옹스님 현재 스크립트명 기준)
      - name: Build 90days due list
        working-directory: System_files
        run: |
          node scripts/build/review-due-90days.cjs

      # 2) (ratings/insights 파일이 이미 갱신됐다는 전제) posts에 reviewData 재주입
      - name: Inject reviewData to posts (resolver)
        working-directory: System_files
        run: |
          node scripts/build/review-resolver.cjs

      # 3) 렌더/정규화/리뷰블록
      - name: Render posts
        working-directory: System_files
        run: |
          npm run posts:render

      - name: Verify rendered HTML exists
        working-directory: System_files
        run: |
          ls dist/posts/*.html > /dev/null
          echo "dist/posts HTML OK"

      - name: Normalize body
        working-directory: System_files
        run: |
          npm run posts:normalize

      - name: Review meta block
        working-directory: System_files
        run: |
          npm run posts:review:meta

      # 4) 검증/QA
      - name: Validate & repair
        working-directory: System_files
        run: |
          npm run posts:validate

      - name: Preflight QA
        working-directory: System_files
        run: |
          npm run posts:qa

      # 5) 발행(선택) + 커밋
      - name: Publish to Blogger (skip when DRY_RUN=true)
        if: env.DRY_RUN != 'true'
        working-directory: System_files
        run: |
          npm run publish:blogger

      - name: Commit freshness updates
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: 90days freshness refresh"
          git push
