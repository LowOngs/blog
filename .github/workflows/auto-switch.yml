name: Auto Publish Switch (file-based)

on:
  workflow_dispatch:
    inputs:
      auto_enable:
        description: "Auto publishing (scheduled) mode"
        required: true
        type: choice
        options:
          - "disable"
          - "enable"

permissions:
  contents: write

jobs:
  toggle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write toggle file
        env:
          MODE: ${{ inputs.auto_enable }}
        run: |
          set -euo pipefail

          if [ "$MODE" = "enable" ]; then
            VALUE="true"
          else
            VALUE="false"
          fi

          mkdir -p System_files/manifests
          cat > System_files/manifests/auto-enable.json <<EOF
          {
            "autoEnable": ${VALUE},
            "updatedAtUtc": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

          echo "[auto-switch] wrote System_files/manifests/auto-enable.json -> autoEnable=$VALUE"
          cat System_files/manifests/auto-enable.json

      - name: Commit & push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add System_files/manifests/auto-enable.json

          if git diff --cached --quiet; then
            echo "[auto-switch] no change (already desired state)"
            exit 0
          fi

          git commit -m "chore: set auto-enable (scheduled publish switch)"
          git push
          echo "[auto-switch] pushed"
