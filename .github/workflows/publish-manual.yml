name: Publish Blog (Manual)

on:
  workflow_dispatch:
    inputs:
      RUN_MODE:
        description: "manual only (auto not allowed here)"
        required: false
        default: "manual"
      MANUAL_JOB:
        description: "label_once / schedule_once"
        required: false
        default: "schedule_once"
      DRY_RUN:
        description: "true = no publish"
        required: false
        default: "true"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Guard — manual only
        run: |
          echo "Manual workflow invoked"
          echo "RUN_MODE=manual enforced"

      - name: Build & Publish (manual)
        env:
          RUN_MODE: manual
          MANUAL_JOB: ${{ inputs.MANUAL_JOB }}
          DRY_RUN: ${{ inputs.DRY_RUN }}
          SCHEDULE_MODE: ${{ secrets.SCHEDULE_MODE }}
        run: |
          npm ci
          node System_files/scripts/build/seed-scheduler.cjs || true
          node System_files/scripts/build/queue-to-posts.cjs || true
          node System_files/scripts/build/generate-body.cjs
          npm run posts:render
          npm run posts:validate
          npm run publish:blogger
