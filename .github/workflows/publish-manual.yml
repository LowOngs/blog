name: Publish Blog (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ongsblog-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # ✅ manual은 원칙적으로 "no_live(검수용)"만
      RUN_MODE: manual
      MANUAL_JOB: schedule_once
      DRY_RUN: "true"

      # 스위치값은 참고용으로만 남김(로그)
      SCHEDULE_MODE: ${{ secrets.SCHEDULE_MODE }}

      # Blogger API (있어도 DRY_RUN이라 호출 안 함이 원칙)
      BLOGGER_BLOG_ID:       ${{ secrets.BLOGGER_BLOG_ID }}
      GOOGLE_CLIENT_ID:      ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET:  ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN:  ${{ secrets.GOOGLE_REFRESH_TOKEN }}

      # 사이트 기본값(필요 시)
      CANONICAL_BASE:  ${{ secrets.CANONICAL_BASE }}
      CDN_BASE:        ${{ secrets.CDN_BASE }}
      TIME_ZONE:       America/Los_Angeles

      # OpenAI(본문 생성은 해도 되고, 싫으면 아래 스텝 주석처리)
      OPENAI_API_KEY:  ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL:    "gpt-4.1-mini"

      # R2(검수용 빌드엔 굳이 없어도 됨)
      R2_ACCOUNT_ID:         ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID:      ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY:  ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET:             ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT:           ${{ secrets.R2_ENDPOINT }}

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Guard (manual must be DRY_RUN)
        run: |
          echo "SCHEDULE_MODE=$SCHEDULE_MODE"
          echo "DRY_RUN=$DRY_RUN"
          if [ "$DRY_RUN" != "true" ]; then
            echo "[GUARD] manual workflow must be DRY_RUN=true. force stop."
            exit 1
          fi

      # (선택) 본문 생성은 검수에도 도움이 되면 유지, 아니면 삭제해도 됨
      - name: Generate body (best-effort)
        run: node System_files/scripts/build/generate-body.cjs || true

      - name: Render posts
        run: npm run posts:render

      - name: Validate & auto-repair
        run: npm run posts:validate

      - name: Check review freshness (best-effort)
        run: node System_files/scripts/build/check-review-freshness.cjs || true

      - name: Check OG freshness (best-effort)
        run: node System_files/scripts/build/check-og-freshness.cjs || true

      # ✅ 중요: manual에서는 publish를 "실제 발행"하지 않음
      # - 그래도 DRY_RUN publish 로그가 필요하면 아래 스텝을 켜도 되지만,
      #   지금은 사고방지를 위해 아예 막아두는 걸 추천합니다.
      - name: Publish (blocked in manual)
        run: |
          echo "[BLOCK] Manual workflow never publishes. Use Publish Blog (Blogger) when switch=live."
          exit 0
