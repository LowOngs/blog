name: Publish Blog (Manual)

on:
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (manual)
        env:
          RUN_MODE: manual
          MANUAL_JOB: schedule_once
          DRY_RUN: "true"
          SCHEDULE_MODE: ${{ secrets.SCHEDULE_MODE }}
        run: |
          npm ci
          node System_files/scripts/build/generate-body.cjs || true
          npm run posts:render
          npm run posts:validate
          node System_files/scripts/build/check-review-freshness.cjs || true
          node System_files/scripts/build/check-og-freshness.cjs || true
          npm run publish:blogger
