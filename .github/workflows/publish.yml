name: publish

on:
  workflow_dispatch:
    inputs:
      RUN_MODE:
        description: "auto/manual"
        required: true
        default: "manual"
      MANUAL_JOB:
        description: "schedule_once/label_once (manual only)"
        required: false
        default: "schedule_once"
      DRY_RUN:
        description: "true/false (manual only)"
        required: false
        default: "true"
  schedule:
    - cron: "15 2 * * *" # UTC 02:15

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # site/cdn
      CANONICAL_BASE: ${{ secrets.CANONICAL_BASE }}
      CDN_BASE: ${{ secrets.CDN_BASE }}

      # Blogger OAuth
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

      # R2
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

      # publish control
      SCHEDULE_MODE: ${{ secrets.SCHEDULE_MODE }} # live/test
      PUBLISH_MODE: ${{ secrets.PUBLISH_MODE }}   # enable/disable

      # inputs
      RUN_MODE: ${{ github.event.inputs.RUN_MODE || 'auto' }}
      MANUAL_JOB: ${{ github.event.inputs.MANUAL_JOB || 'schedule_once' }}
      DRY_RUN_INPUT: ${{ github.event.inputs.DRY_RUN || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install (repo root)
        run: npm ci

      - name: Decide modes
        id: modes
        run: |
          echo "RUN_MODE=${RUN_MODE}"
          echo "MANUAL_JOB=${MANUAL_JOB}"
          echo "DRY_RUN_INPUT=${DRY_RUN_INPUT}"
          EVENT_NAME="${{ github.event_name }}"

          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "${SCHEDULE_MODE}" != "live" ]; then
              echo "SKIP_SCHEDULE=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "SKIP_SCHEDULE=false" >> $GITHUB_OUTPUT
            echo "FINAL_DRY_RUN=false" >> $GITHUB_OUTPUT
            echo "FINAL_RUN_MODE=auto" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "SKIP_SCHEDULE=false" >> $GITHUB_OUTPUT

          if [ "${RUN_MODE}" = "auto" ]; then
            echo "FINAL_DRY_RUN=false" >> $GITHUB_OUTPUT
            echo "FINAL_RUN_MODE=auto" >> $GITHUB_OUTPUT
          else
            if [ "${DRY_RUN_INPUT}" = "true" ]; then
              echo "FINAL_DRY_RUN=true" >> $GITHUB_OUTPUT
            else
              echo "FINAL_DRY_RUN=false" >> $GITHUB_OUTPUT
            fi
            echo "FINAL_RUN_MODE=manual" >> $GITHUB_OUTPUT
          fi

      - name: Stop (schedule disabled)
        if: steps.modes.outputs.SKIP_SCHEDULE == 'true'
        run: |
          echo "Schedule disabled (SCHEDULE_MODE != live)."
          exit 0

      - name: Export runtime env
        run: |
          echo "DRY_RUN=${{ steps.modes.outputs.FINAL_DRY_RUN }}" >> $GITHUB_ENV
          if [ "${{ steps.modes.outputs.FINAL_DRY_RUN }}" = "true" ]; then
            echo "BODY_WRITE_MODE=local" >> $GITHUB_ENV
          else
            echo "BODY_WRITE_MODE=active" >> $GITHUB_ENV
          fi

      - name: Preflight checks (fail fast)
        run: |
          echo "──────── Preflight START ────────"
          node -v
          npm -v

          echo "[sharp]"
          node -e "require('sharp')" || { echo '❌ sharp missing'; exit 1; }

          echo "[dirs]"
          test -d System_files || { echo "❌ System_files missing"; exit 1; }
          test -d System_files/content || { echo "❌ content missing"; exit 1; }

          echo "──────── Preflight PASS ────────"

      # ─────────────── 큐/포스트 생성 ───────────────
      - name: Build queue (scheduler → posts)
        run: |
          npm run posts:queue

      - name: Issue pageIds
        run: |
          npm run posts:ids

      - name: Generate body
        run: |
          npm run posts:body:generate

      # ─────────────── 리뷰 주입(SSOT) ───────────────
      - name: Inject reviewData (resolver)
        run: |
          npm run posts:review:resolve

      # ─────────────── 이미지(본문) 업로드/치환 ───────────────
      - name: Upload images to R2 (body assets)
        run: |
          npm run images:upload

      - name: Rewrite image URLs in posts JSON
        run: |
          npm run images:rewrite

      # ─────────────── 렌더(HTML) ───────────────
      - name: Render posts
        run: |
          npm run posts:render

      - name: Normalize body
        run: |
          npm run posts:normalize

      - name: Inject review meta blocks (HTML)
        run: |
          npm run posts:review:meta

      # ─────────────── OG 생성은 dist/posts 필요 ───────────────
      - name: Build OG images (needs dist/posts)
        run: |
          npm run images:renew
          npm run images:build:og

      - name: Upload images to R2 (include OG)
        run: |
          npm run images:upload

      # ─────────────── 검증/QA ───────────────
      - name: Validate & repair
        run: |
          npm run posts:validate

      - name: Preflight QA
        run: |
          npm run posts:qa

      # ─────────────── 발행 ───────────────
      - name: Publish to Blogger (skip when DRY_RUN=true)
        if: env.DRY_RUN != 'true'
        run: |
          npm run publish:blogger

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "build: publish pipeline output"
          git push
