name: Publish Blog (Blogger)

on:
  workflow_dispatch:
    inputs:
      RUN_MODE:
        description: "auto = 강제 live+실발행 / manual = 선택 실행"
        required: true
        type: choice
        default: "manual"
        options:
          - "auto"
          - "manual"

      MANUAL_JOB:
        description: "manual일 때만 의미: schedule 1회 또는 라벨 1회"
        required: true
        type: choice
        default: "schedule_once"
        options:
          - "schedule_once"
          - "label_once_app-reviews"
          - "label_once_device-reviews"
          - "label_once_subscription-services"
          - "label_once_how-to-playbooks"
          - "label_once_smart-savings"
          - "label_once_templates-checklists"

      DRY_RUN:
        description: "manual에서만 의미: true=no_live / false=live"
        required: true
        type: choice
        default: "true"
        options:
          - "true"
          - "false"

  schedule:
    - cron: "30 0 * * *"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SITE_NAME:       "Ongs Blog"
      SITE_BASE:       https://ongsblog.com
      CANONICAL_BASE:  ${{ secrets.CANONICAL_BASE }}
      CDN_BASE:        ${{ secrets.CDN_BASE }}
      TIME_ZONE:       America/Los_Angeles
      AOIA_ENABLE:     "false"

      # ✅ 2중 통제: schedule 자동발행 허용 스위치 (secrets)
      SCHEDULE_MODE:   ${{ secrets.SCHEDULE_MODE }}

      # === OpenAI (본문 생성기) ===
      OPENAI_API_KEY:  ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL:    "gpt-4.1-mini"

      # === 이미지 처리(R2) ===
      IMAGES_DIR:      System_files/assets/images
      R2_ACCOUNT_ID:         ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID:      ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY:  ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET:             ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT:           ${{ secrets.R2_ENDPOINT }}

      # === Blogger API ===
      BLOGGER_BLOG_ID:       ${{ secrets.BLOGGER_BLOG_ID }}
      GOOGLE_CLIENT_ID:      ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET:  ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN:  ${{ secrets.GOOGLE_REFRESH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # ✅ schedule 자동발행 하드 가드 (SCHEDULE_MODE != live면 아무것도 안 하고 종료)
      - name: Guard schedule (SCHEDULE_MODE must be live)
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "SCHEDULE_MODE=${SCHEDULE_MODE}"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${SCHEDULE_MODE}" != "live" ]; then
              echo "[GUARD] schedule trigger blocked: SCHEDULE_MODE != live"
              exit 0
            fi
          fi

      # ✅ 입력/모드 해석: RUN_MODE / MANUAL_JOB / DRY_RUN → LABEL/MAX_POSTS/DRY_RUN 세팅
      - name: Resolve run mode
        run: |
          EVENT="${{ github.event_name }}"

          # defaults
          RUN_MODE="manual"
          MANUAL_JOB="schedule_once"
          DRY_RUN="true"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            RUN_MODE="${{ github.event.inputs.RUN_MODE }}"
            MANUAL_JOB="${{ github.event.inputs.MANUAL_JOB }}"
            DRY_RUN="${{ github.event.inputs.DRY_RUN }}"
          else
            # schedule 트리거는 auto로 취급 (강제 live+실발행)
            RUN_MODE="auto"
            MANUAL_JOB="schedule_once"
            DRY_RUN="false"
          fi

          LABEL_VALUE=""
          MAX_POSTS_VALUE=""

          if [ "$RUN_MODE" = "auto" ]; then
            # ✅ auto는 무조건 live+실발행 강제
            DRY_RUN="false"
            LABEL_VALUE=""
            MAX_POSTS_VALUE=""
          else
            # manual
            if [ "$MANUAL_JOB" = "schedule_once" ]; then
              LABEL_VALUE=""
              MAX_POSTS_VALUE=""
            else
              # label_once_*
              # 예: label_once_app-reviews → app-reviews
              LABEL_VALUE="${MANUAL_JOB#label_once_}"
              MAX_POSTS_VALUE="1"
            fi
          fi

          echo "RUN_MODE=$RUN_MODE"       >> $GITHUB_ENV
          echo "MANUAL_JOB=$MANUAL_JOB"   >> $GITHUB_ENV
          echo "LABEL=$LABEL_VALUE"       >> $GITHUB_ENV
          echo "MAX_POSTS=$MAX_POSTS_VALUE" >> $GITHUB_ENV
          echo "DRY_RUN=$DRY_RUN"         >> $GITHUB_ENV

          echo "Resolved:"
          echo "  RUN_MODE=$RUN_MODE"
          echo "  MANUAL_JOB=$MANUAL_JOB"
          echo "  LABEL=$LABEL_VALUE"
          echo "  MAX_POSTS=$MAX_POSTS_VALUE"
          echo "  DRY_RUN=$DRY_RUN"

      - name: Verify required files exist
        run: |
          set -e
          test -f System_files/templates/post.html
          test -f System_files/scripts/build/render-posts.cjs
          test -f System_files/scripts/build/validate-repair.cjs
          test -f System_files/scripts/publish/blogger.cjs
          test -f System_files/scripts/build/seed-scheduler.cjs
          test -f System_files/scripts/build/queue-to-posts.cjs
          test -f System_files/scripts/build/images-renew.cjs
          test -f System_files/scripts/build/images-build-og.cjs
          test -f System_files/scripts/build/lib/page-ids.cjs
          test -f System_files/scripts/build/ids.cjs

      # === 오늘 발행 시드 선택 → 큐 생성 ===
      # manual label_once는 “발행 단계에서 1개만” 나가게 MAX_POSTS=1로 통제(추가 발급 사고 방지)
      - name: Plan today posts from seedpool
        run: node System_files/scripts/build/seed-scheduler.cjs

      - name: Generate posts from today queue
        run: node System_files/scripts/build/queue-to-posts.cjs

      # === Page ID 발급 (DRY_RUN=true → no_live 자동 강제) ===
      - name: Issue page IDs
        env:
          DRY_RUN: ${{ env.DRY_RUN }}
        run: node System_files/scripts/build/ids.cjs

      # === 본문 자동생성 ===
      - name: Generate article bodies (if body empty)
        run: node System_files/scripts/build/generate-body.cjs

      # === JSON → HTML 렌더 ===
      - name: Render posts (JSON → HTML)
        run: npm run posts:render

      - name: Normalize article body paragraphs
        run: node System_files/scripts/build/normalize-body.cjs

      # === OG 이미지 / 이미지 업로드 ===
      - name: Renew OG manifest
        run: npm run images:renew

      - name: Build OG images
        run: npm run images:build:og

      - name: Upload images to R2
        run: node System_files/scripts/build/r2-upload.js

      - name: Rewrite image URLs
        run: node System_files/scripts/build/rewrite-images.js

      # === AIO / SEO 교정 ===
      - name: Validate & auto-repair
        run: npm run posts:validate

      # === 발행 ===
      - name: Publish to Blogger
        env:
          LABEL:     ${{ env.LABEL }}
          MAX_POSTS: ${{ env.MAX_POSTS }}
          DRY_RUN:   ${{ env.DRY_RUN }}
        run: npm run publish:blogger

      # === 아티팩트 보관 ===
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          path: |
            System_files/logs/**
            System_files/dist/posts/**
          if-no-files-found: warn
          retention-days: 7
