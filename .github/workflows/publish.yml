name: publish

on:
  workflow_dispatch:
    inputs:
      RUN_MODE:
        description: "auto/manual"
        required: true
        default: "manual"
      MANUAL_JOB:
        description: "schedule_once/label_once (manual only)"
        required: false
        default: "schedule_once"
      DRY_RUN:
        description: "true/false (manual only)"
        required: false
        default: "true"
  schedule:
    - cron: "15 2 * * *" # UTC 02:15 (KST 11:15)

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      # ── Runtime base (SSOT)
      SYSTEM_ROOT: System_files

      CANONICAL_BASE: ${{ secrets.CANONICAL_BASE }}
      CDN_BASE: ${{ secrets.CDN_BASE }}

      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

      SCHEDULE_MODE: ${{ secrets.SCHEDULE_MODE }} # live/test
      PUBLISH_MODE: ${{ secrets.PUBLISH_MODE }}   # enable/disable

      RUN_MODE: ${{ github.event.inputs.RUN_MODE || 'auto' }}
      MANUAL_JOB: ${{ github.event.inputs.MANUAL_JOB || 'schedule_once' }}
      DRY_RUN_INPUT: ${{ github.event.inputs.DRY_RUN || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # repo root 기준
      - name: Install dependencies
        run: npm ci

      - name: Decide modes
        id: modes
        shell: bash
        run: |
          parse_dry_run () {
            v="$(echo "${1:-}" | tr '[:upper:]' '[:lower:]' | xargs)"
            if [ "$v" = "false" ] || [ "$v" = "0" ]; then
              echo "false"
            else
              echo "true"
            fi
          }

          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${SCHEDULE_MODE}" != "live" ]; then
              echo "SKIP_SCHEDULE=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "SKIP_SCHEDULE=false" >> $GITHUB_OUTPUT
            echo "FINAL_DRY_RUN=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "SKIP_SCHEDULE=false" >> $GITHUB_OUTPUT

          if [ "${RUN_MODE}" = "auto" ]; then
            echo "FINAL_DRY_RUN=false" >> $GITHUB_OUTPUT
          else
            echo "FINAL_DRY_RUN=$(parse_dry_run "${DRY_RUN_INPUT}")" >> $GITHUB_OUTPUT
          fi

      - name: Stop (schedule disabled)
        if: steps.modes.outputs.SKIP_SCHEDULE == 'true'
        run: exit 0

      - name: Export runtime env
        run: |
          echo "DRY_RUN=${{ steps.modes.outputs.FINAL_DRY_RUN }}" >> $GITHUB_ENV

      # ─────────────────────────────────────────────
      # 이하 전부 System_files 기준
      # ─────────────────────────────────────────────

      - name: Sanity check
        working-directory: System_files
        run: |
          test -f scripts/build/seed-scheduler.cjs
          test -f scripts/build/queue-to-posts.cjs
          test -f scripts/build/ids.cjs
          test -f scripts/build/generate-body.cjs
          test -f scripts/build/render-posts.cjs
          test -f scripts/publish/blogger.cjs

      - name: Build queue + body
        working-directory: System_files
        run: |
          node scripts/build/seed-scheduler.cjs
          node scripts/build/queue-to-posts.cjs
          node scripts/build/ids.cjs
          node scripts/build/generate-body.cjs

      - name: Reviews / render
        working-directory: System_files
        run: |
          node scripts/build/review-resolver.cjs
          node scripts/build/render-posts.cjs
          node scripts/build/normalize-body.cjs
          node scripts/build/review-meta-block.cjs

      - name: Images
        working-directory: System_files
        run: |
          node scripts/build/images-renew.cjs
          node scripts/build/images-build-og.cjs
          npm run images:upload
          npm run images:rewrite

      - name: Render after rewrite
        working-directory: System_files
        run: |
          node scripts/build/render-posts.cjs
          node scripts/build/normalize-body.cjs

      - name: Validate & QA
        working-directory: System_files
        run: |
          node scripts/build/validate-repair.cjs
          npm run posts:qa

      - name: AI outputs
        working-directory: System_files
        run: |
          node scripts/build/update-posts-index.cjs
          node scripts/build/ai-meta.js
          node scripts/build/build-feed.cjs
          node scripts/build/validate-feed.cjs

      - name: Tools + Trust page
        working-directory: System_files
        run: |
          node scripts/build/copy-tools.cjs
          node scripts/build/build-trust-page.cjs

      - name: Publish to Blogger
        if: env.DRY_RUN != 'true' && env.PUBLISH_MODE == 'enable'
        working-directory: System_files
        run: |
          node scripts/publish/blogger.cjs

      # repo root 기준
      - name: Commit artifacts
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "build: publish pipeline output"
          git push
