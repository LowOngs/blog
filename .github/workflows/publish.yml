name: publish

on:
  workflow_dispatch:
    inputs:
      RUN_MODE:
        description: "auto/manual"
        required: true
        default: "manual"
      MANUAL_JOB:
        description: "schedule_once/label_once (manual only)"
        required: false
        default: "schedule_once"
      DRY_RUN:
        description: "true/false (manual only)"
        required: false
        default: "true"
  schedule:
    - cron: "15 2 * * *" # UTC 02:15 (KST 11:15)

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # site/cdn
      CANONICAL_BASE: ${{ secrets.CANONICAL_BASE }}
      CDN_BASE: ${{ secrets.CDN_BASE }}

      # Blogger OAuth
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

      # R2
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

      # publish control
      SCHEDULE_MODE: ${{ secrets.SCHEDULE_MODE }} # live/test
      PUBLISH_MODE: ${{ secrets.PUBLISH_MODE }}   # enable/disable

      # inputs (없으면 default)
      RUN_MODE: ${{ github.event.inputs.RUN_MODE || 'auto' }}
      MANUAL_JOB: ${{ github.event.inputs.MANUAL_JOB || 'schedule_once' }}
      DRY_RUN_INPUT: ${{ github.event.inputs.DRY_RUN || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Print runner time
        run: |
          echo "Local time:"
          date
          echo "UTC time:"
          date -u

      - name: Install
        working-directory: System_files
        run: npm ci

      - name: Verify native dependencies
        working-directory: System_files
        run: |
          node -e "require('sharp'); console.log('sharp OK')"

      - name: Decide modes
        id: modes
        run: |
          echo "RUN_MODE=${RUN_MODE}"
          echo "MANUAL_JOB=${MANUAL_JOB}"
          echo "DRY_RUN_INPUT=${DRY_RUN_INPUT}"

          EVENT_NAME="${{ github.event_name }}"

          # schedule 트리거는 SCHEDULE_MODE=live 일 때만 동작
          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "${SCHEDULE_MODE}" != "live" ]; then
              echo "SKIP_SCHEDULE=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "SKIP_SCHEDULE=false" >> $GITHUB_OUTPUT
            echo "FINAL_DRY_RUN=false" >> $GITHUB_OUTPUT
            echo "FINAL_RUN_MODE=auto" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "SKIP_SCHEDULE=false" >> $GITHUB_OUTPUT

          # workflow_dispatch
          if [ "${RUN_MODE}" = "auto" ]; then
            echo "FINAL_DRY_RUN=false" >> $GITHUB_OUTPUT
            echo "FINAL_RUN_MODE=auto" >> $GITHUB_OUTPUT
          else
            if [ "${DRY_RUN_INPUT}" = "true" ]; then
              echo "FINAL_DRY_RUN=true" >> $GITHUB_OUTPUT
            else
              echo "FINAL_DRY_RUN=false" >> $GITHUB_OUTPUT
            fi
            echo "FINAL_RUN_MODE=manual" >> $GITHUB_OUTPUT
          fi

      - name: Stop (schedule disabled)
        if: steps.modes.outputs.SKIP_SCHEDULE == 'true'
        run: |
          echo "Schedule is disabled (SCHEDULE_MODE != live). Exit."
          exit 0

      - name: Export runtime env
        run: |
          echo "DRY_RUN=${{ steps.modes.outputs.FINAL_DRY_RUN }}" >> $GITHUB_ENV
          if [ "${{ steps.modes.outputs.FINAL_DRY_RUN }}" = "true" ]; then
            echo "BODY_WRITE_MODE=local" >> $GITHUB_ENV
          else
            echo "BODY_WRITE_MODE=active" >> $GITHUB_ENV
          fi

      # ─────────────────────
      # 1) 큐/포스트 생성
      # ─────────────────────
      - name: Build queue (scheduler)
        working-directory: System_files
        run: |
          node scripts/build/seed-scheduler.cjs

      - name: Queue -> posts
        working-directory: System_files
        run: |
          node scripts/build/queue-to-posts.cjs

      - name: Page IDs
        working-directory: System_files
        run: |
          node scripts/build/ids.cjs

      - name: Generate body
        working-directory: System_files
        run: |
          node scripts/build/generate-body.cjs

      # ─────────────────────
      # 2) 리뷰 데이터 주입(SSOT)
      # ─────────────────────
      - name: Inject reviewData (resolver)
        working-directory: System_files
        run: |
          node scripts/build/review-resolver.cjs

      # ─────────────────────
      # 3) 렌더/정규화/리뷰블록
      # ─────────────────────
      - name: Render posts
        working-directory: System_files
        run: |
          npm run posts:render

      - name: Verify rendered HTML exists
        working-directory: System_files
        run: |
          ls dist/posts/*.html > /dev/null
          echo "dist/posts HTML OK"

      - name: Normalize body
        working-directory: System_files
        run: |
          npm run posts:normalize

      - name: Review meta block
        working-directory: System_files
        run: |
          npm run posts:review:meta

      # ─────────────────────
      # 4) 이미지(OG 포함) + 업로드 + rewrite
      # ─────────────────────
      - name: Renew images manifest (from dist/posts)
        working-directory: System_files
        run: |
          npm run images:renew

      - name: Verify images-manifest
        working-directory: System_files
        run: |
          test -f manifests/images-manifest.json
          echo "images-manifest OK"

      - name: Build OG images
        working-directory: System_files
        run: |
          npm run images:build:og

      - name: Upload images to R2
        working-directory: System_files
        run: |
          npm run images:upload

      - name: Rewrite image URLs in posts JSON
        working-directory: System_files
        run: |
          npm run images:rewrite

      # ─────────────────────
      # 5) 검증/QA
      # ─────────────────────
      - name: Validate & repair
        working-directory: System_files
        run: |
          npm run posts:validate

      - name: Preflight QA
        working-directory: System_files
        run: |
          npm run posts:qa

      # ─────────────────────
      # 6) 발행 + 커밋
      # ─────────────────────
      - name: Publish to Blogger (skip when DRY_RUN=true)
        if: env.DRY_RUN != 'true'
        working-directory: System_files
        run: |
          npm run publish:blogger

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "build: publish pipeline output"
          git push
