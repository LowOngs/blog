name: publish

on:
  workflow_dispatch:
    inputs:
      RUN_MODE:
        description: "auto/manual"
        required: true
        default: "manual"
      MANUAL_JOB:
        description: "schedule_once/label_once (manual only)"
        required: false
        default: "schedule_once"
      DRY_RUN:
        description: "true/false (manual only)"
        required: false
        default: "true"
  schedule:
    - cron: "15 2 * * *" # KST 11:15 (UTC 02:15)

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # 공통: site/cdn
      CANONICAL_BASE: ${{ secrets.CANONICAL_BASE }}
      CDN_BASE: ${{ secrets.CDN_BASE }}

      # Blogger OAuth
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

      # R2
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

      # publish control (2중 가드용)
      SCHEDULE_MODE: ${{ secrets.SCHEDULE_MODE }} # live/test
      PUBLISH_MODE: ${{ secrets.PUBLISH_MODE }}   # enable/disable

      # inputs (없으면 default)
      RUN_MODE: ${{ github.event.inputs.RUN_MODE || 'auto' }}
      MANUAL_JOB: ${{ github.event.inputs.MANUAL_JOB || 'schedule_once' }}
      DRY_RUN_INPUT: ${{ github.event.inputs.DRY_RUN || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        working-directory: System_files
        run: npm ci

      - name: Decide modes
        id: modes
        run: |
          echo "RUN_MODE=${RUN_MODE}"
          echo "MANUAL_JOB=${MANUAL_JOB}"
          echo "DRY_RUN_INPUT=${DRY_RUN_INPUT}"
          # ─────────────────────────────────────────
          # 분기 규칙(핵심):
          # 1) schedule 트리거는 SCHEDULE_MODE=live 일 때만 동작
          # 2) auto는 무조건 live (DRY_RUN 무시)
          # 3) manual은 DRY_RUN=true면 no_live, false면 live
          # ─────────────────────────────────────────
          EVENT_NAME="${{ github.event_name }}"

          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "${SCHEDULE_MODE}" != "live" ]; then
              echo "SKIP_SCHEDULE=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "SKIP_SCHEDULE=false" >> $GITHUB_OUTPUT
            echo "FINAL_DRY_RUN=false" >> $GITHUB_OUTPUT
            echo "FINAL_RUN_MODE=auto" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "SKIP_SCHEDULE=false" >> $GITHUB_OUTPUT

          if [ "${RUN_MODE}" = "auto" ]; then
            echo "FINAL_DRY_RUN=false" >> $GITHUB_OUTPUT
            echo "FINAL_RUN_MODE=auto" >> $GITHUB_OUTPUT
          else
            # manual
            if [ "${DRY_RUN_INPUT}" = "true" ]; then
              echo "FINAL_DRY_RUN=true" >> $GITHUB_OUTPUT
            else
              echo "FINAL_DRY_RUN=false" >> $GITHUB_OUTPUT
            fi
            echo "FINAL_RUN_MODE=manual" >> $GITHUB_OUTPUT
          fi

      - name: Stop (schedule disabled)
        if: steps.modes.outputs.SKIP_SCHEDULE == 'true'
        run: |
          echo "Schedule is disabled (SCHEDULE_MODE != live). Exit."
          exit 0

      - name: Export runtime env
        run: |
          echo "DRY_RUN=${{ steps.modes.outputs.FINAL_DRY_RUN }}" >> $GITHUB_ENV
          # page-ids.cjs active 발급 가드가 PUBLISH_MODE+DRY_RUN에 걸려있으므로 여기서 일관되게 세팅
          if [ "${{ steps.modes.outputs.FINAL_DRY_RUN }}" = "true" ]; then
            echo "BODY_WRITE_MODE=local" >> $GITHUB_ENV
          else
            echo "BODY_WRITE_MODE=active" >> $GITHUB_ENV
          fi

      - name: Build queue (scheduler)
        working-directory: System_files
        run: |
          # 여기서 MANUAL_JOB 분기를 “실제 동작”으로 쓰려면,
          # seed-scheduler.cjs가 옵션/환경변수를 지원해야 합니다.
          # 현재는 단일 실행(기본 동작)으로 유지합니다.
          node scripts/build/seed-scheduler.cjs

      - name: Build OG images
        working-directory: System_files
        run: |
          node scripts/build/images-renew.cjs
          node scripts/build/images-build-og.cjs

      - name: Upload images to R2
        working-directory: System_files
        run: |
          npm run images:upload

      - name: Rewrite image URLs in posts JSON
        working-directory: System_files
        run: |
          npm run images:rewrite

      - name: Render posts
        working-directory: System_files
        run: |
          node scripts/build/render-posts.cjs

      - name: Validate & repair
        working-directory: System_files
        run: |
          node scripts/build/validate-repair.cjs

      - name: Preflight QA
        working-directory: System_files
        run: |
          npm run qa:check

      - name: Publish to Blogger (skip when DRY_RUN=true)
        if: env.DRY_RUN != 'true'
        working-directory: System_files
        run: |
          node scripts/build/blogger.cjs

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "build: publish pipeline output"
          git push
