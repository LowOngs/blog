# .github/workflows/publish.yml
name: Publish Blog (Blogger)

on:
  workflow_dispatch:
    inputs:
      RUN_MODE:
        description: "auto = 강제 live+실발행 / manual = 선택 실행"
        required: true
        type: choice
        default: "manual"
        options: ["auto", "manual"]

      MANUAL_JOB:
        description: "manual일 때만 의미: schedule 1회 또는 라벨 1회"
        required: true
        type: choice
        default: "schedule_once"
        options:
          - "schedule_once"
          - "label_once_app-reviews"
          - "label_once_device-reviews"
          - "label_once_subscription-services"
          - "label_once_how-to-playbooks"
          - "label_once_smart-savings"
          - "label_once_templates-checklists"

      DRY_RUN:
        description: "manual에서만 의미: true=no_live / false=live(실행권한 필요)"
        required: true
        type: choice
        default: "true"
        options: ["true", "false"]

  schedule:
    - cron: "30 0 * * *" # UTC 기준. 필요 시 조정

permissions:
  contents: read

concurrency:
  group: ongsblog-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    # ✅ 하드 가드: schedule은 PUBLISH_MODE=enable일 때만 시작
    # ✅ 수동은 DRY_RUN=true면 항상 허용, DRY_RUN=false면 PUBLISH_MODE=enable일 때만
    if: >-
      ${{
        (github.event_name == 'schedule' && secrets.PUBLISH_MODE == 'enable')
        || (github.event_name == 'workflow_dispatch'
            && (github.event.inputs.DRY_RUN == 'true' || secrets.PUBLISH_MODE == 'enable'))
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SITE_NAME:       "Ongs Blog"
      SITE_BASE:       https://ongsblog.com
      CANONICAL_BASE:  ${{ secrets.CANONICAL_BASE }}
      CDN_BASE:        ${{ secrets.CDN_BASE }}
      TIME_ZONE:       America/Los_Angeles
      AOIA_ENABLE:     "false"

      # ✅ 최종 안전장치(2개)
      PUBLISH_MODE:    ${{ secrets.PUBLISH_MODE }}       # enable|disable
      BODY_WRITE_MODE: ${{ secrets.BODY_WRITE_MODE }}    # live|dry (미설정이면 아래에서 dry로 보정)

      # === OpenAI ===
      OPENAI_API_KEY:  ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL:    "gpt-4.1-mini"

      # === 이미지 처리(R2) ===
      IMAGES_DIR:      System_files/assets/images
      R2_ACCOUNT_ID:         ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID:      ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY:  ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET:             ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT:           ${{ secrets.R2_ENDPOINT }}

      # === Blogger API ===
      BLOGGER_BLOG_ID:       ${{ secrets.BLOGGER_BLOG_ID }}
      GOOGLE_CLIENT_ID:      ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET:  ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN:  ${{ secrets.GOOGLE_REFRESH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Resolve effective modes (single source)
        shell: bash
        run: |
          set -euo pipefail

          EVENT="${{ github.event_name }}"

          # defaults
          RUN_MODE="manual"
          MANUAL_JOB="schedule_once"
          INPUT_DRY_RUN="true"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            RUN_MODE="${{ github.event.inputs.RUN_MODE }}"
            MANUAL_JOB="${{ github.event.inputs.MANUAL_JOB }}"
            INPUT_DRY_RUN="${{ github.event.inputs.DRY_RUN }}"
          else
            # schedule은 auto + 실발행으로 고정 (단, job-level if에서 PUBLISH_MODE=enable 아니면 시작 불가)
            RUN_MODE="auto"
            MANUAL_JOB="schedule_once"
            INPUT_DRY_RUN="false"
          fi

          # BODY_WRITE_MODE 기본값 보정: 미설정이면 dry
          BWM="${BODY_WRITE_MODE:-dry}"
          if [ "$BWM" != "live" ]; then BWM="dry"; fi

          # BODY_WRITE_MODE가 dry면 어떤 경우든 안전하게 DRY_RUN=true로 고정
          EFFECTIVE_DRY_RUN="$INPUT_DRY_RUN"
          if [ "$BWM" = "dry" ]; then
            EFFECTIVE_DRY_RUN="true"
          fi

          # label_once_* 처리
          LABEL_VALUE=""
          MAX_POSTS_VALUE=""

          if [ "$RUN_MODE" = "auto" ]; then
            LABEL_VALUE=""
            MAX_POSTS_VALUE=""
            EFFECTIVE_DRY_RUN="false" # auto는 실발행 전제 (단, BWM=dry면 위에서 true로 덮임)
          else
            if [ "$MANUAL_JOB" = "schedule_once" ]; then
              LABEL_VALUE=""
              MAX_POSTS_VALUE=""
            else
              LABEL_VALUE="${MANUAL_JOB#label_once_}"
              MAX_POSTS_VALUE="1"
            fi
          fi

          # ✅ 레거시 호환(당장 코드 안 부수기용)
          # - ids/page-ids는 PAGE_ID_MODE를 사용하므로 BODY_WRITE_MODE 기반으로 매핑
          if [ "$BWM" = "live" ] && [ "$EFFECTIVE_DRY_RUN" = "false" ]; then
            PAGE_ID_MODE="live"
          else
            PAGE_ID_MODE="no_live"
          fi

          # - generate-body 등 일부가 SCHEDULE_MODE를 참조할 수 있어 호환값 주입
          #   (향후 제거 가능)
          if [ "$EFFECTIVE_DRY_RUN" = "false" ]; then
            SCHEDULE_MODE="live"
          else
            SCHEDULE_MODE="test"
          fi

          echo "RUN_MODE=$RUN_MODE"               >> $GITHUB_ENV
          echo "MANUAL_JOB=$MANUAL_JOB"           >> $GITHUB_ENV
          echo "LABEL=$LABEL_VALUE"               >> $GITHUB_ENV
          echo "MAX_POSTS=$MAX_POSTS_VALUE"       >> $GITHUB_ENV
          echo "DRY_RUN=$EFFECTIVE_DRY_RUN"       >> $GITHUB_ENV
          echo "PAGE_ID_MODE=$PAGE_ID_MODE"       >> $GITHUB_ENV
          echo "SCHEDULE_MODE=$SCHEDULE_MODE"     >> $GITHUB_ENV
          echo "BODY_WRITE_MODE=$BWM"             >> $GITHUB_ENV

          echo "Resolved:"
          echo "  EVENT=$EVENT"
          echo "  PUBLISH_MODE=${PUBLISH_MODE}"
          echo "  BODY_WRITE_MODE=$BWM"
          echo "  RUN_MODE=$RUN_MODE"
          echo "  MANUAL_JOB=$MANUAL_JOB"
          echo "  DRY_RUN(input)=$INPUT_DRY_RUN -> DRY_RUN(effective)=$EFFECTIVE_DRY_RUN"
          echo "  PAGE_ID_MODE=$PAGE_ID_MODE"
          echo "  SCHEDULE_MODE(compat)=$SCHEDULE_MODE"
          echo "  LABEL=$LABEL_VALUE"
          echo "  MAX_POSTS=$MAX_POSTS_VALUE"

      - name: Hard guard (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          # 수동에서 DRY_RUN=false(실발행)면 PUBLISH_MODE=enable이어야 함 (job-level if로도 막히지만, 로그 명확화)
          if [ "${DRY_RUN}" = "false" ] && [ "${PUBLISH_MODE}" != "enable" ]; then
            echo "[GUARD] blocked: DRY_RUN=false requires PUBLISH_MODE=enable"
            exit 1
          fi

      - name: Verify required files exist
        run: |
          set -e
          test -f System_files/templates/post.html
          test -f System_files/scripts/build/render-posts.cjs
          test -f System_files/scripts/build/validate-repair.cjs
          test -f System_files/scripts/publish/blogger.cjs
          test -f System_files/scripts/build/seed-scheduler.cjs
          test -f System_files/scripts/build/queue-to-posts.cjs
          test -f System_files/scripts/build/images-renew.cjs
          test -f System_files/scripts/build/images-build-og.cjs
          test -f System_files/scripts/build/lib/page-ids.cjs
          test -f System_files/scripts/build/ids.cjs
          test -f System_files/scripts/build/review-meta-block.cjs

      - name: Plan today posts from seedpool
        run: node System_files/scripts/build/seed-scheduler.cjs

      - name: Generate posts from today queue
        run: node System_files/scripts/build/queue-to-posts.cjs

      - name: Issue page IDs (retry 2)
        env:
          PAGE_ID_MODE: ${{ env.PAGE_ID_MODE }}
        run: |
          set -e
          tries=2
          for i in $(seq 1 $tries); do
            echo "[ids] attempt $i/$tries (PAGE_ID_MODE=$PAGE_ID_MODE)"
            if node System_files/scripts/build/ids.cjs; then
              echo "[ids] OK"
              exit 0
            fi
            if [ "$i" -lt "$tries" ]; then
              echo "[ids] FAIL, retry after backoff..."
              sleep $((2 ** i))
            fi
          done
          echo "[ids] FAIL after retries"
          exit 1

      - name: Generate article bodies (if body empty)
        env:
          SCHEDULE_MODE: ${{ env.SCHEDULE_MODE }} # compat (향후 제거 가능)
        run: node System_files/scripts/build/generate-body.cjs

      - name: Render posts (JSON → HTML)
        run: npm run posts:render

      - name: Normalize article body paragraphs
        run: node System_files/scripts/build/normalize-body.cjs

      # ✅ 추가: 리뷰 평점/히스토그램/인사이트 블록 최종 주입(dist HTML 치환)
      - name: Inject review rating & insights blocks (dist HTML)
        run: npm run posts:review:meta

      - name: Renew OG manifest
        run: npm run images:renew

      - name: Build OG images
        run: npm run images:build:og

      - name: Upload images to R2
        run: node System_files/scripts/build/r2-upload.js

      - name: Rewrite image URLs
        run: node System_files/scripts/build/rewrite-images.js

      - name: Validate & auto-repair
        run: npm run posts:validate

      - name: Publish to Blogger
        env:
          LABEL:     ${{ env.LABEL }}
          MAX_POSTS: ${{ env.MAX_POSTS }}
          DRY_RUN:   ${{ env.DRY_RUN }}
        run: npm run publish:blogger

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          path: |
            System_files/logs/**
            System_files/dist/posts/**
          if-no-files-found: warn
          retention-days: 7
