name: publish

on:
  workflow_dispatch:
    inputs:
      RUN_MODE:
        description: "auto/manual"
        required: true
        default: "manual"
      MANUAL_JOB:
        description: "schedule_once/label_once (manual only)"
        required: false
        default: "schedule_once"
      DRY_RUN:
        description: "true/false (manual only)"
        required: false
        default: "true"
  schedule:
    - cron: "15 2 * * *" # KST 11:15 (UTC 02:15)

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # site/cdn
      CANONICAL_BASE: ${{ secrets.CANONICAL_BASE }}
      CDN_BASE: ${{ secrets.CDN_BASE }}

      # Blogger OAuth
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

      # R2
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

      # publish control (2중 가드)
      SCHEDULE_MODE: ${{ secrets.SCHEDULE_MODE }} # live/test
      PUBLISH_MODE: ${{ secrets.PUBLISH_MODE }}   # enable/disable

      # inputs
      RUN_MODE: ${{ github.event.inputs.RUN_MODE || 'auto' }}
      MANUAL_JOB: ${{ github.event.inputs.MANUAL_JOB || 'schedule_once' }}
      DRY_RUN_INPUT: ${{ github.event.inputs.DRY_RUN || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        run: npm ci

      - name: Decide modes
        id: modes
        run: |
          echo "RUN_MODE=${RUN_MODE}"
          echo "MANUAL_JOB=${MANUAL_JOB}"
          echo "DRY_RUN_INPUT=${DRY_RUN_INPUT}"
          EVENT_NAME="${{ github.event_name }}"

          # 1) schedule 트리거는 SCHEDULE_MODE=live 일 때만 동작
          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "${SCHEDULE_MODE}" != "live" ]; then
              echo "SKIP_SCHEDULE=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "SKIP_SCHEDULE=false" >> $GITHUB_OUTPUT
            echo "FINAL_DRY_RUN=false" >> $GITHUB_OUTPUT
            echo "FINAL_RUN_MODE=auto" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "SKIP_SCHEDULE=false" >> $GITHUB_OUTPUT

          # 2) auto는 무조건 live (DRY_RUN 무시)
          if [ "${RUN_MODE}" = "auto" ]; then
            echo "FINAL_DRY_RUN=false" >> $GITHUB_OUTPUT
            echo "FINAL_RUN_MODE=auto" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 3) manual은 DRY_RUN=true면 no_live, false면 live
          if [ "${DRY_RUN_INPUT}" = "true" ]; then
            echo "FINAL_DRY_RUN=true" >> $GITHUB_OUTPUT
          else
            echo "FINAL_DRY_RUN=false" >> $GITHUB_OUTPUT
          fi
          echo "FINAL_RUN_MODE=manual" >> $GITHUB_OUTPUT

      - name: Stop (schedule disabled)
        if: steps.modes.outputs.SKIP_SCHEDULE == 'true'
        run: |
          echo "Schedule is disabled (SCHEDULE_MODE != live). Exit."
          exit 0

      - name: Export runtime env
        run: |
          echo "DRY_RUN=${{ steps.modes.outputs.FINAL_DRY_RUN }}" >> $GITHUB_ENV

          # DRY_RUN이면 발행/active write를 막는 방향으로 통일
          if [ "${{ steps.modes.outputs.FINAL_DRY_RUN }}" = "true" ]; then
            echo "BODY_WRITE_MODE=local" >> $GITHUB_ENV
          else
            echo "BODY_WRITE_MODE=active" >> $GITHUB_ENV
          fi

      # ─────────────────────────────────────────
      # 1) 콘텐츠 생성 파이프라인(스케줄러 → posts json)
      # ─────────────────────────────────────────
      - name: Build queue (scheduler)
        run: node ./System_files/scripts/build/seed-scheduler.cjs

      - name: Queue → Posts JSON
        run: node ./System_files/scripts/build/queue-to-posts.cjs

      - name: PageId issue
        run: node ./System_files/scripts/build/ids.cjs

      - name: Generate body
        run: npm run posts:body:generate

      # ─────────────────────────────────────────
      # 2) 리뷰 파이프라인(merge → resolve → meta)
      # ─────────────────────────────────────────
      - name: Review ratings merge (next → baseline)
        run: npm run posts:review:update

      - name: Review data resolve (inject to posts)
        run: npm run posts:review:resolve

      - name: Review meta blocks build
        run: npm run posts:review:meta

      # ─────────────────────────────────────────
      # 3) 렌더/정규화
      # ─────────────────────────────────────────
      - name: Render posts
        run: npm run posts:render

      - name: Normalize body
        run: npm run posts:normalize

      # ─────────────────────────────────────────
      # 4) 이미지(OG 생성 → 업로드 → rewrite)
      # ─────────────────────────────────────────
      - name: Build OG images
        run: |
          npm run images:renew
          npm run images:build:og

      - name: Upload images to R2
        run: npm run images:upload

      - name: Rewrite image URLs in posts JSON
        run: npm run images:rewrite

      # ─────────────────────────────────────────
      # 5) 검증/QA + 90일 due 산출물 생성
      # ─────────────────────────────────────────
      - name: Validate & repair
        run: npm run posts:validate

      - name: Preflight QA
        run: npm run posts:qa

      - name: Build 90days due list (dist/reviews)
        run: npm run reviews:due

      # ─────────────────────────────────────────
      # 6) Blogger publish
      # ─────────────────────────────────────────
      - name: Publish to Blogger (skip when DRY_RUN=true or PUBLISH_MODE!=enable)
        if: env.DRY_RUN != 'true' && env.PUBLISH_MODE == 'enable'
        run: npm run publish:blogger

      # ─────────────────────────────────────────
      # 7) Commit artifacts
      # ─────────────────────────────────────────
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "build: publish pipeline output"
          git push
