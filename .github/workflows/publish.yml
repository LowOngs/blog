name: publish

on:
  workflow_dispatch:
    inputs:
      RUN_MODE:
        description: "auto | manual  (auto=실발행 강제, manual=DRY_RUN에 따라 live/no_live)"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - manual
      MANUAL_JOB:
        description: "manual일 때만: schedule_once | label_once"
        required: false
        default: "schedule_once"
        type: choice
        options:
          - schedule_once
          - label_once
      DRY_RUN:
        description: "manual일 때만 사용: true면 no_live(발행 금지), false면 live(실발행)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

  # ✅ 자동발행(스케줄) — SCHEDULE_MODE=live 일 때만 실행하도록 가드
  schedule:
    # 매일 09:10 KST (UTC 00:10)
    - cron: "10 0 * * *"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # ─────────────────────────────
      # 사이트/이미지 베이스
      # ─────────────────────────────
      CANONICAL_BASE: ${{ secrets.CANONICAL_BASE }}
      SITE_BASE: ${{ secrets.CANONICAL_BASE }}
      CDN_BASE: ${{ secrets.CDN_BASE }}

      # ─────────────────────────────
      # Blogger OAuth
      # ─────────────────────────────
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

      # ─────────────────────────────
      # Cloudflare R2
      # ─────────────────────────────
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

      # ─────────────────────────────
      # PageId
      # ─────────────────────────────
      PAGEID_SECRET: ${{ secrets.PAGEID_SECRET }}

      # ─────────────────────────────
      # 자동발행 가드 (스케줄 전용)
      # secrets.SCHEDULE_MODE 가 live가 아니면 schedule 트리거는 즉시 종료
      # ─────────────────────────────
      SCHEDULE_MODE: ${{ secrets.SCHEDULE_MODE }}

      # ─────────────────────────────
      # Review due-list 임박 기준(일)
      # ─────────────────────────────
      DUE_SOON_DAYS: "7"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "System_files/package-lock.json"

      - name: Install deps
        working-directory: System_files
        run: npm ci

      # ─────────────────────────────
      # ✅ 모드 결정 (auto/manual + DRY_RUN)
      # - auto: 무조건 live 강제 (DRY_RUN 무시)
      # - manual: DRY_RUN=true → no_live, false → live
      # - schedule: SCHEDULE_MODE=live가 아니면 종료
      # ─────────────────────────────
      - name: Resolve run mode (live/no_live) + schedule guard
        id: mode
        shell: bash
        run: |
          echo "EVENT=${{ github.event_name }}"
          echo "RUN_MODE=${{ inputs.RUN_MODE }}"
          echo "MANUAL_JOB=${{ inputs.MANUAL_JOB }}"
          echo "DRY_RUN=${{ inputs.DRY_RUN }}"
          echo "SCHEDULE_MODE=${SCHEDULE_MODE}"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${SCHEDULE_MODE}" != "live" ]; then
              echo "SCHEDULE_MODE is not live → exit safely."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "PUBLISH_MODE=live" >> $GITHUB_ENV
            echo "BODY_WRITE_MODE=local" >> $GITHUB_ENV
            echo "RUN_MODE_FINAL=auto" >> $GITHUB_ENV
            exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT

          if [ "${{ inputs.RUN_MODE }}" = "auto" ]; then
            echo "PUBLISH_MODE=live" >> $GITHUB_ENV
            echo "BODY_WRITE_MODE=local" >> $GITHUB_ENV
            echo "RUN_MODE_FINAL=auto" >> $GITHUB_ENV
          else
            if [ "${{ inputs.DRY_RUN }}" = "true" ]; then
              echo "PUBLISH_MODE=no_live" >> $GITHUB_ENV
              echo "BODY_WRITE_MODE=local" >> $GITHUB_ENV
              echo "RUN_MODE_FINAL=manual" >> $GITHUB_ENV
            else
              echo "PUBLISH_MODE=live" >> $GITHUB_ENV
              echo "BODY_WRITE_MODE=local" >> $GITHUB_ENV
              echo "RUN_MODE_FINAL=manual" >> $GITHUB_ENV
            fi
          fi

      - name: Early exit if skipped
        if: steps.mode.outputs.skip == 'true'
        run: echo "Skipped by schedule guard."

      # ─────────────────────────────
      # 0) (선택) 큐/시드 스케줄러 (있으면 실행)
      # ─────────────────────────────
      - name: Seed scheduler (optional)
        if: steps.mode.outputs.skip != 'true'
        working-directory: System_files
        shell: bash
        run: |
          if [ -f "scripts/build/seed-scheduler.cjs" ]; then
            echo "[seed] run seed-scheduler.cjs"
            node scripts/build/seed-scheduler.cjs
          else
            echo "[seed] no seed-scheduler.cjs (skip)"
          fi

      # ─────────────────────────────
      # 1) PageId 발급/정렬 (있으면 실행)
      # ─────────────────────────────
      - name: PageId issue (optional)
        if: steps.mode.outputs.skip != 'true'
        working-directory: System_files
        shell: bash
        run: |
          if [ -f "scripts/build/ids.cjs" ]; then
            echo "[ids] run ids.cjs"
            node scripts/build/ids.cjs
          else
            echo "[ids] no ids.cjs (skip)"
          fi

      # ─────────────────────────────
      # 2) OG 이미지/이미지 파이프라인 (있으면 실행)
      # ─────────────────────────────
      - name: Images renew (optional)
        if: steps.mode.outputs.skip != 'true'
        working-directory: System_files
        shell: bash
        run: |
          if [ -f "scripts/build/images-renew.cjs" ]; then
            node scripts/build/images-renew.cjs
          else
            echo "[images] no images-renew.cjs (skip)"
          fi

      - name: Build OG images (optional)
        if: steps.mode.outputs.skip != 'true'
        working-directory: System_files
        shell: bash
        run: |
          if [ -f "scripts/build/images-build-og.cjs" ]; then
            node scripts/build/images-build-og.cjs
          else
            echo "[images] no images-build-og.cjs (skip)"
          fi

      - name: Upload images to R2 (optional)
        if: steps.mode.outputs.skip != 'true'
        working-directory: System_files
        shell: bash
        run: |
          if [ -f "scripts/build/r2-upload.js" ] || [ -f "scripts/build/r2-upload.cjs" ]; then
            if npm run -s | grep -q "images:upload"; then
              npm run images:upload
            else
              echo "[images] no npm script images:upload (skip)"
            fi
          else
            echo "[images] no r2-upload script (skip)"
          fi

      - name: Rewrite image URLs in posts (optional)
        if: steps.mode.outputs.skip != 'true'
        working-directory: System_files
        shell: bash
        run: |
          if npm run -s | grep -q "images:rewrite"; then
            npm run images:rewrite
          else
            echo "[images] no npm script images:rewrite (skip)"
          fi

      # ─────────────────────────────
      # 3) 리뷰 데이터: next→baseline 병합 + posts 주입 + due-list 생성
      # ─────────────────────────────
      - name: Review diff update (3-bucket)
        if: steps.mode.outputs.skip != 'true'
        working-directory: System_files
        shell: bash
        run: |
          if [ -f "scripts/build/review-diff-update.cjs" ]; then
            node scripts/build/review-diff-update.cjs
          else
            echo "[review] no review-diff-update.cjs (skip)"
          fi

      - name: Review resolver (inject to posts.reviewData)
        if: steps.mode.outputs.skip != 'true'
        working-directory: System_files
        shell: bash
        run: |
          if [ -f "scripts/build/review-resolver.cjs" ]; then
            node scripts/build/review-resolver.cjs
          else
            echo "[review] no review-resolver.cjs (skip)"
          fi

      - name: Review due 90days list
        if: steps.mode.outputs.skip != 'true'
        working-directory: System_files
        shell: bash
        run: |
          if [ -f "scripts/build/review-due-90days.cjs" ]; then
            node scripts/build/review-due-90days.cjs
          else
            echo "[review] no review-due-90days.cjs (skip)"
          fi

      # ─────────────────────────────
      # 4) 렌더 → validate-repair → feed → validate-feed → QA
      # ─────────────────────────────
      - name: Render posts
        if: steps.mode.outputs.skip != 'true'
        working-directory: System_files
        run: node scripts/build/render-posts.cjs

      - name: Validate & repair posts (optional)
        if: steps.mode.outputs.skip != 'true'
        working-directory: System_files
        shell: bash
        run: |
          if [ -f "scripts/build/validate-repair.cjs" ]; then
            node scripts/build/validate-repair.cjs
          else
            echo "[validate] no validate-repair.cjs (skip)"
          fi

      - name: Build AI feed (optional)
        if: steps.mode.outputs.skip != 'true'
        working-directory: System_files
        shell: bash
        run: |
          if npm run -s | grep -q "ai:feed"; then
            npm run ai:feed
          elif [ -f "scripts/build/feed.cjs" ]; then
            node scripts/build/feed.cjs
          else
            echo "[feed] no feed generator (skip)"
          fi

      - name: Validate AI feed (optional)
        if: steps.mode.outputs.skip != 'true'
        working-directory: System_files
        shell: bash
        run: |
          if [ -f "scripts/build/validate-feed.cjs" ]; then
            node scripts/build/validate-feed.cjs
          else
            echo "[feed] no validate-feed.cjs (skip)"
          fi

      - name: Preflight QA (optional)
        if: steps.mode.outputs.skip != 'true'
        working-directory: System_files
        shell: bash
        run: |
          if npm run -s | grep -q "qa:check"; then
            npm run qa:check
          else
            echo "[qa] no qa:check (skip)"
          fi

      # ─────────────────────────────
      # 5) Blogger 발행 (PUBLISH_MODE=live일 때만)
      # ─────────────────────────────
      - name: Publish to Blogger (live only)
        if: steps.mode.outputs.skip != 'true' && env.PUBLISH_MODE == 'live'
        working-directory: System_files
        shell: bash
        run: |
          echo "[publish] PUBLISH_MODE=live"
          if npm run -s | grep -q "publish"; then
            npm run publish
          elif [ -f "scripts/build/blogger.cjs" ]; then
            node scripts/build/blogger.cjs
          else
            echo "[publish] no publish script found"
            exit 1
          fi

      - name: No-live mode (skip publish)
        if: steps.mode.outputs.skip != 'true' && env.PUBLISH_MODE != 'live'
        run: echo "PUBLISH_MODE=no_live → publish step skipped."

      # ─────────────────────────────
      # (선택) 산출물 업로드(디버그용)
      # ─────────────────────────────
      - name: Upload dist artifacts (debug)
        if: steps.mode.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: System_files/dist
          if-no-files-found: warn
