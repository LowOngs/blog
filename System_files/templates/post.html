<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{title}}</title>
  <meta name="description" content="{{description}}" />

  <!-- Canonical (renderer fills) -->
  <link rel="canonical" href="{{canonical}}">

  <!-- Schema & dynamic meta (OG/Twitter/Preload/hreflang) injected by meta module -->
  <!--META-->

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --c-border:#e5e7eb;
      --c-bg:#f8fafc;
      --c-badge-bg:#eef6ff;
      --c-badge-bd:#cfe2ff;
      --c-badge-tx:#1e40af;
      --c-text:#111827;
      --c-muted:#6b7280;
      --radius:12px;
    }

    /* ✅ 핵심: Blogger 테마를 덮지 않기 위해 html/body는 건드리지 않음
       - 흰 배경/패딩 문제의 원인: body{background:#fff; padding:24px;}
       - 해결: 글 영역만 감싸는 래퍼(.ongs-post)에만 스타일 적용 */
    .ongs-post{
      font:16px/1.65 system-ui,Segoe UI,Arial,sans-serif;
      color:var(--c-text);
      padding:24px;
      background:transparent; /* Blogger 배경이 그대로 보이게 */
    }

    /* ─────────────────────────────────────────────
      Page badge (pageId)
      - render-posts.cjs fills {{pageId}} and {{canonical}}
      - id="pageId" / data-page-id MUST stay (pipeline rules)
    ───────────────────────────────────────────── */
    .page-badge{
      display:inline-block;
      font-size:12px;
      text-decoration:none;
      border:1px solid var(--c-border);
      border-radius:999px;
      padding:4px 10px;
      color:var(--c-muted);
      margin:0 0 10px;
    }

    /* Updated badge (must keep structure) */
    .updated-badge{
      display:inline-block;
      background:var(--c-badge-bg);
      border:1px solid var(--c-badge-bd);
      color:var(--c-badge-tx);
      border-radius:999px;
      padding:4px 10px;
      font-size:12px;
      margin:8px 0 0;
    }

    /* Hero */
    .post-hero{ margin:16px 0 14px; }
    .post-hero img{
      display:block;
      width:100%;
      max-width:100%;
      height:auto;
      border-radius:var(--radius);
    }

    /* TL;DR + KeyFacts boxes */
    .tldr,.keyfacts{
      background:var(--c-bg);
      border:1px solid var(--c-border);
      border-radius:var(--radius);
      padding:12px 14px;
      margin:12px 0;
    }
    .tldr ul,.keyfacts ul{ margin:0; padding-left:18px; }

    /* Collapsible (Key Facts / FAQ container style) */
    details.collapsible{
      border:1px solid var(--c-border);
      border-radius:var(--radius);
      background:transparent; /* ✅ 테마 배경 존중 */
      margin:12px 0;
      overflow:hidden;
    }
    details.collapsible > summary{
      list-style:none;
      cursor:pointer;
      padding:12px 14px;
      font-weight:650;
      background:#fff; /* summary는 가독성 위해 유지 */
    }
    details.collapsible > summary::-webkit-details-marker{display:none}
    details.collapsible[open] > summary{border-bottom:1px solid var(--c-border)}
    details.collapsible .panel{padding:12px 14px; background:var(--c-bg)}

    /* ─────────────────────────────────────────────
      ✅ 본문 타이포 강제 통일 (글 영역 내부만)
    ───────────────────────────────────────────── */
    main{
      margin-top:16px;
      max-width:980px;
    }
    main p{ margin:10px 0; }
    main ul, main ol{ margin:10px 0; padding-left:20px; }
    main li{ margin:4px 0; }

    /* 모든 라벨에서 h2/h3 크기/색/무게 통일 */
    main h2{
      font-size:26px;
      line-height:1.25;
      margin:26px 0 10px;
      color:var(--c-text);
      font-weight:780;
      letter-spacing:-0.2px;
    }
    main h3{
      font-size:19px;
      line-height:1.35;
      margin:18px 0 8px;
      color:var(--c-text);
      font-weight:720;
    }
    main h4{
      font-size:16px;
      margin:14px 0 6px;
      color:var(--c-text);
      font-weight:700;
    }

    /* blockquote / code (안전 기본) */
    main blockquote{
      margin:12px 0;
      padding:10px 12px;
      border-left:3px solid var(--c-border);
      background:var(--c-bg);
      border-radius:10px;
    }
    main code{
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:0.95em;
    }

    /* FAQ/Sources */
    .faq h3,.sources h3{margin:18px 0 8px; font-size:18px}
    .sources{font-size:.95rem; opacity:.92}
    .sources ul{margin:8px 0 0; padding-left:18px}

    /* Review blocks */
    .review-block{
      border:1px solid var(--c-border);
      border-radius:var(--radius);
      padding:12px 14px;
      margin:12px 0;
      background:#fff;
    }
    .review-block__title{
      font-weight:800;
      font-size:16px;
      margin:0 0 8px;
    }
    .review-block__meta{
      font-size:12px;
      color:var(--c-muted);
      margin-bottom:8px;
    }

    /* ✅ 템플릿 기본(빈) 리뷰 블록은 숨김
       - review-meta-block.cjs가 SSOT로 치환하면 이 클래스가 사라져 자동 노출됨 */
    .review-block--empty{ display:none; }

    .review-rating-table{
      width:100%;
      border-collapse:collapse;
      font-size:14px;
    }
    .review-rating-table th,
    .review-rating-table td{
      padding:6px 6px;
      border-top:1px solid var(--c-border);
      text-align:left;
    }
    .review-rating-table th{ font-weight:650; }

    .review-insights-list{
      margin:0;
      padding-left:18px;
      font-size:14px;
    }
    .review-insights-list li{ margin:4px 0; }

    .review-histogram{ margin-top:10px; }
    .review-histogram-row{
      display:flex;
      align-items:center;
      gap:10px;
      margin:4px 0;
      font-size:12px;
    }
    .review-histogram-label{ width:44px; color:var(--c-muted); }
    .review-histogram-bar-wrap{
      flex:1;
      height:8px;
      border-radius:999px;
      background:#f3f4f6;
      overflow:hidden;
    }
    .review-histogram-bar{
      height:100%;
      border-radius:999px;
      background:var(--c-badge-tx);
    }
    .review-histogram-value{
      width:44px;
      text-align:right;
      color:var(--c-muted);
    }

    /* ─────────────────────────────────────────────
      ✅ Ad slots (MID + BOTTOM) — 위치 확정
    ───────────────────────────────────────────── */
    .ad-slot{
      border:1px dashed var(--c-border);
      border-radius:var(--radius);
      background:#fff;
      margin:14px 0;
      padding:12px 14px;
      color:var(--c-muted);
      font-size:13px;
    }
    .ad-slot__label{
      font-size:12px;
      margin:0 0 6px;
      opacity:.85;
    }
  </style>
</head>
<body>

  <!-- ✅ 글 전체를 래핑: Blogger 배경/레이아웃 존중 -->
  <div class="ongs-post">

    <!-- Page badge -->
    <a class="page-badge" id="pageId" data-page-id="{{pageId}}" href="{{canonical}}" rel="nofollow">{{pageId}}</a>
    <!--SLOT:PAGE_BADGE-->

    <div class="updated-badge" aria-label="Updated">Updated {{updated}}</div>

    <figure class="post-hero" style="overflow:hidden;">
      <img src="{{heroImage}}" alt="{{heroAlt}}" loading="eager" fetchpriority="high" style="max-width:100%;height:auto;" />
    </figure>
    <!--SLOT:HERO_IMAGE-->

    <!-- TL;DR -->
    <section id="tldr">
      <section class="tldr">
        {{tldr}}
        <!--SLOT:AFTER_TLDR-->
      </section>
    </section>

    <!-- Key Facts -->
    <details class="collapsible" id="keyfacts">
      <summary>Key Facts</summary>
      <div class="panel">
        <section class="keyfacts">
          {{keyfacts}}
        </section>
      </div>
    </details>

    <!-- Ad Slot (MID) -->
    <div class="ad-slot" id="ad-mid" aria-label="Ad slot (mid)">
      <div class="ad-slot__label">Ad (mid)</div>
      <!-- SLOT:ADS_MID -->
      <!-- 여기에 애드센스 코드(계정별) 삽입 -->
    </div>

    <main>
      <!-- 본문 -->
      <section id="review-base-block">
        {{body}}
      </section>

      <!-- ─────────────────────────────────────────────
        ✅ 리뷰 섹션 “실물”을 템플릿에서 항상 탑재 (B안)
        - dist 산출물에 섹션이 항상 존재 → review-meta-block.cjs가 SSOT로 치환 가능
        - 기본 상태는 숨김(.review-block--empty)
        - SSOT 치환 시 새 HTML에는 이 클래스가 없어 자동 노출됨
        - id="review-rating-block" / id="review-insights-block"는 절대 변경 금지
      ───────────────────────────────────────────── -->

      <!--SLOT:REVIEW_RATING_WRAPPER-->
      <section id="review-rating-block" class="review-block review-block--empty">
        <!-- placeholder: replaced by review-meta-block.cjs when SSOT exists -->
      </section>

      <!--SLOT:REVIEW_INSIGHTS_WRAPPER-->
      <section id="review-insights-block" class="review-block review-block--empty">
        <!-- placeholder: replaced by review-meta-block.cjs when SSOT exists -->
      </section>
    </main>

    <!-- FAQ -->
    <!--SLOT:FAQ_WRAPPER-->

    <!-- Ad Slot (BOTTOM) -->
    <div class="ad-slot" id="ad-bottom" aria-label="Ad slot (bottom)">
      <div class="ad-slot__label">Ad (bottom)</div>
      <!-- SLOT:ADS_BOTTOM -->
      <!-- 여기에 애드센스 코드(계정별) 삽입 -->
    </div>

    <!-- Sources -->
    <!--SLOT:SOURCES_WRAPPER-->

    <!-- Desktop: auto open Key Facts -->
    <script>
      (function(){
        try{
          var isDesktop = window.matchMedia('(min-width: 769px)').matches;
          var kf = document.getElementById('keyfacts');
          if(isDesktop && kf && !kf.hasAttribute('open')) kf.setAttribute('open','');
        }catch(e){}
      })();
    </script>

  </div>
</body>
</html>
