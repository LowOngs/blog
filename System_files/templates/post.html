<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{title}}</title>
  <meta name="description" content="{{description}}" />

  <!-- Canonical (renderer fills) -->
  <link rel="canonical" href="{{canonical}}">

  <!-- Schema & dynamic meta (OG/Twitter/Preload/hreflang) injected by meta module -->
  <!--META-->

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --c-border:#e5e7eb;
      --c-bg:#f8fafc;
      --c-badge-bg:#eef6ff;
      --c-badge-bd:#cfe2ff;
      --c-badge-tx:#1e40af;
      --c-text:#111827;
      --c-muted:#6b7280;
      --radius:12px;
    }

    body{
      font:16px/1.65 system-ui,Segoe UI,Arial,sans-serif;
      color:var(--c-text);
      margin:0;
      padding:24px;
      background:#fff;
    }

    /* page badge */
    .page-badge{
      display:inline-block;
      font-size:12px;
      text-decoration:none;
      border:1px solid var(--c-border);
      border-radius:999px;
      padding:4px 10px;
      color:var(--c-muted);
      margin:0 0 10px;
    }

    /* Updated badge */
    .updated-badge{
      display:inline-block;
      background:var(--c-badge-bg);
      border:1px solid var(--c-badge-bd);
      color:var(--c-badge-tx);
      border-radius:999px;
      padding:4px 10px;
      font-size:12px;
      margin:8px 0 0;
    }

    /* Hero */
    .post-hero{ margin:16px 0 14px; }
    .post-hero img{
      display:block;
      width:100%;
      max-width:100%;
      height:auto;
      border-radius:var(--radius);
    }

    /* TL;DR + KeyFacts boxes */
    .tldr,.keyfacts{
      background:var(--c-bg);
      border:1px solid var(--c-border);
      border-radius:var(--radius);
      padding:12px 14px;
      margin:12px 0;
    }
    .tldr ul,.keyfacts ul{ margin:0; padding-left:18px; }

    /* Collapsible */
    details.collapsible{
      border:1px solid var(--c-border);
      border-radius:var(--radius);
      background:#fff;
      margin:12px 0;
      overflow:hidden;
    }
    details.collapsible > summary{
      list-style:none;
      cursor:pointer;
      padding:12px 14px;
      font-weight:650;
    }
    details.collapsible > summary::-webkit-details-marker{display:none}
    details.collapsible[open] > summary{border-bottom:1px solid var(--c-border)}
    details.collapsible .panel{padding:12px 14px; background:var(--c-bg)}

    /* ===== 핵심: 본문 타이포 강제 통일 ===== */
    main{
      margin-top:16px;
      max-width:980px;
    }
    main p{ margin:10px 0; }
    main ul, main ol{ margin:10px 0; padding-left:20px; }
    main li{ margin:4px 0; }

    /* 모든 라벨에서 h2/h3 크기/색/무게 통일 */
    main h2{
      font-size:26px;
      line-height:1.25;
      margin:26px 0 10px;
      color:var(--c-text);
      font-weight:780;
      letter-spacing:-0.2px;
    }
    main h3{
      font-size:19px;
      line-height:1.35;
      margin:18px 0 8px;
      color:var(--c-text);
      font-weight:720;
    }
    main h4{
      font-size:16px;
      margin:14px 0 6px;
      color:var(--c-text);
      font-weight:700;
    }

    /* blockquote / code (안전 기본) */
    main blockquote{
      margin:12px 0;
      padding:10px 12px;
      border-left:3px solid var(--c-border);
      background:var(--c-bg);
      border-radius:10px;
    }
    main code{
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:0.95em;
    }

    /* FAQ/Sources */
    .faq h3,.sources h3{margin:18px 0 8px; font-size:18px}
    .sources{font-size:.95rem; opacity:.92}
    .sources ul{margin:8px 0 0; padding-left:18px}

    /* Review blocks */
    .review-block{
      border:1px solid var(--c-border);
      border-radius:var(--radius);
      padding:12px 14px;
      margin:12px 0;
      background:#fff;
    }
    .review-block__title{
      font-weight:800;
      font-size:16px;
      margin:0 0 8px;
    }
    .review-block__meta{
      font-size:12px;
      color:var(--c-muted);
      margin-bottom:8px;
    }
    .review-rating-table{
      width:100%;
      border-collapse:collapse;
      font-size:14px;
    }
    .review-rating-table th,
    .review-rating-table td{
      padding:6px 6px;
      border-top:1px solid var(--c-border);
      text-align:left;
    }
    .review-rating-table th{ font-weight:650; }

    .review-insights-list{
      margin:0;
      padding-left:18px;
      font-size:14px;
    }
    .review-insights-list li{ margin:4px 0; }

    .review-histogram{ margin-top:10px; }
    .review-histogram-row{
      display:flex;
      align-items:center;
      gap:10px;
      margin:4px 0;
      font-size:12px;
    }
    .review-histogram-label{ width:44px; color:var(--c-muted); }
    .review-histogram-bar-wrap{
      flex:1;
      height:8px;
      border-radius:999px;
      background:#f3f4f6;
      overflow:hidden;
    }
    .review-histogram-bar{
      height:100%;
      border-radius:999px;
      background:var(--c-badge-tx);
    }
    .review-histogram-value{
      width:44px;
      text-align:right;
      color:var(--c-muted);
    }
  </style>
</head>
<body>

  <!-- Page badge -->
  <a class="page-badge" id="pageId" data-page-id="{{pageId}}" href="{{canonical}}" rel="nofollow">{{pageId}}</a>
  <!--SLOT:PAGE_BADGE-->

  <div class="updated-badge" aria-label="Updated">Updated {{updated}}</div>

  <figure class="post-hero" style="overflow:hidden;">
    <img src="{{heroImage}}" alt="{{heroAlt}}" loading="eager" fetchpriority="high" style="max-width:100%;height:auto;" />
  </figure>
  <!--SLOT:HERO_IMAGE-->

  <!-- TL;DR -->
  <section id="tldr">
    <section class="tldr">
      {{tldr}}
      <!--SLOT:AFTER_TLDR-->
    </section>
  </section>

  <!-- Key Facts -->
  <details class="collapsible" id="keyfacts">
    <summary>Key Facts</summary>
    <div class="panel">
      <section class="keyfacts">
        {{keyfacts}}
      </section>
    </div>
  </details>

  <main>
    <!-- 본문 -->
    <section id="review-base-block">
      {{body}}
    </section>

    <!-- 리뷰 전용 (렌더러가 조건부 삽입) -->
    <!--SLOT:REVIEW_RATING_WRAPPER-->
    <!--SLOT:REVIEW_INSIGHTS_WRAPPER-->
  </main>

  <!-- FAQ -->
  <!--SLOT:FAQ_WRAPPER-->

  <!-- Sources -->
  <!--SLOT:SOURCES_WRAPPER-->

  <!-- Desktop: auto open Key Facts -->
  <script>
    (function(){
      try{
        var isDesktop = window.matchMedia('(min-width: 769px)').matches;
        var kf = document.getElementById('keyfacts');
        if(isDesktop && kf && !kf.hasAttribute('open')) kf.setAttribute('open','');
      }catch(e){}
    })();
  </script>

</body>
</html>
